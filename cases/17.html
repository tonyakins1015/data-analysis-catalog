  if(data.noData){ naCanvas(weekday); return; }const c=weekday,{x,w,h}=setupCanvas(c);x.clearRect(0,0,w,h);const l=64,t=42,cw=w-76,ch=h-68,max=Math.max(...data.lines.flatMap(s=>s.vals),1)*1.12;x.font='8px Malgun Gothic';for(let k=0;k<=6;k++){let y=t+ch-ch*k/6;x.strokeStyle='#e7ebef';x.beginPath();x.moveTo(l,y);x.lineTo(l+cw,y);x.stroke();x.fillStyle='#55616d';x.textAlign='right';x.fillText(max>=1e6?Math.round(max*k/6/1e4).toLocaleString()+'만':Math.round(max*k/6).toLocaleString(),l-7,y+3)}
 // legend across top
 let lx=l,ly=8;data.lines.forEach((s,i)=>{let need=58;if(lx+need>w-15){lx=l;ly+=12}x.fillStyle=lineColors[i%lineColors.length];x.fillRect(lx,ly+3,12,2);x.fillStyle='#263443';x.textAlign='left';x.fillText(s.name,lx+16,ly+5);lx+=need});
 data.weekdays.forEach((d,i)=>{let xx=l+cw*i/(data.weekdays.length-1);x.fillStyle='#263443';x.textAlign='center';x.fillText(d,xx,h-8)});
 data.lines.forEach((s,si)=>{x.strokeStyle=lineColors[si%lineColors.length];x.lineWidth=1.15;x.beginPath();s.vals.forEach((v,i)=>{let xx=l+cw*i/(s.vals.length-1),yy=t+ch-ch*v/max;i?x.lineTo(xx,yy):x.moveTo(xx,yy)});x.stroke()});
 if(hoverDay>=0){const xx=l+cw*hoverDay/(data.weekdays.length-1);x.save();x.setLineDash([3,3]);x.strokeStyle='#777';x.beginPath();x.moveTo(xx,t);x.lineTo(xx,t+ch);x.stroke();x.restore();
   // y-axis helper marker and x-axis black label
   x.fillStyle='#000';x.fillRect(xx-16,h-19,32,14);x.fillStyle='#fff';x.textAlign='center';x.font='bold 8px Malgun Gothic';x.fillText(data.weekdays[hoverDay],xx,h-9);x.font='8px Malgun Gothic';
   const sorted=data.lines.map((s,i)=>({name:s.name,val:s.vals[hoverDay],color:lineColors[i%lineColors.length]})).sort((a,b)=>b.val-a.val);
   let baseY=t+5;const boxW=76,boxH=13;let bx=Math.min(w-boxW-7,Math.max(l+5,xx+8));sorted.forEach((d,idx)=>{let by=baseY+idx*boxH;if(by+boxH>t+ch) return;x.fillStyle=d.color;x.fillRect(bx,by,boxW,boxH-1);x.fillStyle='#15202c';x.textAlign='left';x.fillText(`${d.name}: ${d.val.toLocaleString()}`,bx+3,by+9)});
 }

weekday.onmousemove=e=>{const r=weekday.getBoundingClientRect(),mx=e.clientX-r.left;const l=45,cw=r.width-58;let i=Math.round((mx-l)/(cw/(data.weekdays.length-1)));i=Math.max(0,Math.min(data.weekdays.length-1,i));if(i!==hoverDay){hoverDay=i;drawWeek()};weekday.style.cursor='crosshair'};weekday.onmouseleave=()=>{hoverDay=-1;weekday.style.cursor='default';drawWeek();hideTip()};
function naCanvas(c){
  const {x,w,h}=setupCanvas(c); x.clearRect(0,0,w,h);
  x.fillStyle='#fbfcfd'; x.fillRect(0,0,w,h);
  x.strokeStyle='#dde3e8'; x.setLineDash([4,3]); x.strokeRect(1,1,w-2,h-2); x.setLineDash([]);
  x.fillStyle='#c0392b'; x.font='bold 10px Malgun Gothic'; x.textAlign='center';
  x.fillText('공공데이터 미확보', w/2, h/2-12);
  x.fillStyle='#a3adb3'; x.font='9px Malgun Gothic';
  x.fillText('버스 승하차 인원은 지자체별로 개별 개방되어 전국 표준 데이터가 없습니다.', w/2, h/2+6);
  x.fillText(SHORT[SD]+' 승하차 자료가 확보되면 자동으로 표시됩니다.', w/2, h/2+20);
}
function syncLabels(){
  const S=SHORT[SD], det=hasDetail(), rSel=V('route'), kSel=V('kind'), mSel=V('month');
  document.getElementById('brandName').textContent=S+' 데이터서비스';
  document.title=SD+' 교통 분석';
  document.getElementById('lbl1').textContent=S+' 버스정류장 분포';
  const bs = RD.meta.busan_sh_date.slice(0,7).replace('-','.');
  const bu = RD.meta.busan_use_date.slice(0,7).replace('-','.');
  document.getElementById('lbl2').textContent= isSeoul()
    ? (rSel ? rSel+' 정류장별 이용량 TOP12 · '+mSel : S+' 정류장별 이용량 TOP12 · '+mSel)
    : isBusan()
    ? (rSel ? rSel+' 정류장별 승하차 TOP12 · '+bs : S+' 정류장별 승하차 TOP12 · '+bs)
    : S+' 정류장별 이용량';
  document.getElementById('lbl3').textContent= isSeoul()
    ? (kSel ? kSel+' 노선별 이용량 TOP10 · '+mSel : S+' 노선별 이용량 TOP10 · '+mSel)
    : isBusan() ? S+' 노선별 교통카드 이용건수 TOP10 · '+bu
    : S+' 노선별 이용량';
  document.getElementById('lbl4').textContent= isSeoul()
    ? (rSel ? rSel+' 시간대별 승차 인원' : kSel ? kSel+' 시간대별 승차 인원' : S+' 시간대별 승차 인원 (월별 비교)')
    : isBusan() ? (rSel ? rSel+' 시간대별 승차 건수 · '+bs : S+' 시간대별 승차 건수 · '+bs)
    : S+' 시간대별 이용 패턴';
  const us=document.querySelectorAll('.unit');
  if(us.length>=4){ us[0].textContent='(단위 : 개소)';
    us[1].textContent=det?'(단위 : 명)':'';
    us[2].textContent=isBusan()?'(단위 : 건)':det?'(단위 : 명)':'';
    us[3].textContent=isBusan()?'(단위 : 건)':det?'(단위 : 명)':''; }
  document.getElementById('srcNote').textContent = isSeoul()
    ? '국토교통부 전국 버스정류장 위치정보('+RD.meta.stop_date+') · 서울시 버스노선별 정류장별 시간대별 승하차 인원('+RD.meta.seoul_period+')'
    : isBusan() ? '국토교통부 전국 버스정류장 위치정보('+RD.meta.stop_date+') · 부산광역시 노선별 이용건수('+RD.meta.busan_use_date+') · 승하차 정보('+RD.meta.busan_sh_date+')'
    : '국토교통부 전국 버스정류장 위치정보('+RD.meta.stop_date+')';
  document.getElementById('dataNote').innerHTML = det ? ''
    : '<b style="color:#ef4d43">승하차 상세 미확보</b> — 정류장 분포만 표시됩니다.';
}
function fillSelectors(){
  const st=RD.stops[SD]||{gus:{}};
  const gu=document.getElementById('gu');
  gu.innerHTML='<option value="">'+SHORT[SD]+' 전체</option>'+Object.keys(st.gus).map(g=>'<option>'+g+'</option>').join('');
  const mo=document.getElementById('month');
  mo.innerHTML= isSeoul() ? RD.seoul.months.map(m=>'<option>'+m+'</option>').join('')
              : isBusan() ? '<option>'+RD.meta.busan_use_date.slice(0,7).replace('-','.')+'</option>'
              : '<option>'+RD.meta.stop_date.slice(0,7).replace('-','.')+'</option>';
  mo.selectedIndex = isSeoul() ? RD.seoul.months.length-1 : 0;
  mo.disabled = !isSeoul();
  const kd=document.getElementById('kind');
  kd.innerHTML='<option value="">전체</option>'+(isSeoul()?RD.seoul.types.map(t=>'<option>'+t+'</option>').join(''):'');
  kd.disabled = !isSeoul();
  const rt=document.getElementById('route');
  const rl= isSeoul() ? Object.keys(RD.seoul.route_stop)
          : isBusan() ? Object.keys(RD.busan.route_stop).map(r=>r+'번') : [];
  rt.innerHTML='<option value="">전체 노선</option>'+rl.map(r=>'<option>'+r+'</option>').join('');
  rt.disabled = !rl.length;
}
function render(){syncLabels();drawMap();drawH();drawV();drawWeek()}window.addEventListener('resize',()=>requestAnimationFrame(render));

(function(){
  const ss=document.getElementById('sido');
  ss.value=SD;
  function refresh(){ fillSelectors(); data=generate(); render(); }
  function redraw(){ data=generate(); render(); }
  ss.addEventListener('change', e=>{ SD=e.target.value; refresh(); });
  ['gu','month','kind','route'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.addEventListener('change', redraw);
  });
  const btn=document.getElementById('search'); if(btn) btn.addEventListener('click', redraw);
  setTimeout(refresh, 0);
})();

</script>
