  <style>

    .mainnav{height:100%;display:flex;justify-content:center;align-items:end;gap:64px}.mainnav button{height:100%;border:0;border-bottom:3px solid transparent;background:transparent;font-weight:800;color:#223146;padding:0 8px 21px}.mainnav button.active{border-color:var(--mint)}

    .home-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:12px}.home-insights{padding:20px}.insight-list{display:grid;gap:10px;margin-top:15px}.insight{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;border:1px solid #e4eaee;border-radius:10px;padding:12px}.insight b{display:block}.insight small{color:#7b8795}.rank{font-weight:900;color:#e89600}.home-footer{font-size:11px;color:#7a8795;padding:16px 4px 6px}

.sido-picker{display:flex;align-items:center;gap:8px;padding:10px 14px}
.sido-picker label{font-size:12px;color:#7a8490;font-weight:700}
.sido-picker select{min-width:150px}
.map-box{overflow:auto;max-height:560px}
.map-na{display:grid;place-items:center;min-height:220px;color:#a3adb3;font-size:12.5px;
  border:1px dashed #e2d7bb;border-radius:10px}
rect.district:hover{filter:brightness(.94)}

<body>
  <a class="skip" href="#content">본문 바로가기</a>
  <div class="topline"><div class="topline-inner"><span>● 서울의 창업과 골목경제를 한눈에</span><span class="topline-links"><span>서울소식</span><span>도움말</span><span>분야별정보</span></span></div></div>

      }

  function metricRange(metric){
  return metric==='생활업종 사업자수' ? ['biz','명']
       : metric==='평균 존속연수'     ? ['survival','년']
       : metric==='사업자당 점포수'   ? ['density','개']
       : metric==='전년대비 증감률'   ? ['growth','%']
       : ['store','개'];
}
function metricKey(metric){ return metricRange(metric)[0]; }
function metricUnit(metric){ return metricRange(metric)[1]; }
function metricDecimals(metric){
  return (metric==='평균 존속연수'||metric==='전년대비 증감률') ? 1
       : metric==='사업자당 점포수' ? 2 : 0;
}

  function drawStartup(){
  const vals = districtData('growth');
  drawMap('startupMap', vals, '%', selectDistrict, 2);
  downloads.startupMap = vals;
  const n = ND(), d = state.district;
  const tot  = Object.values(n.biz_gu||{}).reduce((a,b)=>a+RF(b[0]),0);
  const prevT= Object.values(n.biz_gu||{}).reduce((a,b)=>a+RF(b[2]),0);
  const sel  = d ? (n.biz_gu||{})[d] : null;
  const cur  = sel ? RF(sel[0]) : tot;
  const pre  = sel ? RF(sel[2]) : prevT;
  const store= d ? RF((n.store_gu||{})[d])
                 : Object.values(n.store_gu||{}).reduce((a,b)=>a+RF(b),0);
  const surv = d ? RF(((n.surv_gu||{})[d]||{}).avg) : RF(n.surv_avg);
  const rows = [
    ['생활업종 사업자수', pre, cur, '명'],
    ['상가 점포수', null, store, '개'],
    ['사업자당 점포수', null, pre?+(store/cur).toFixed(2):0, '개'],
    ['평균 존속연수', null, surv, '년']];
  const tb = document.getElementById('startupTable');
  if(tb) tb.innerHTML =
    `<table><thead><tr><th>${scopeName()}</th><th>전년동월</th><th>증감</th><th>당월</th></tr></thead><tbody>`+
    rows.map(r=>{
      const dec = (r[3]==='년' || r[0].includes('당')) ? 2 : 0;
      if(r[1]==null) return `<tr><td>${r[0]}</td><td>—</td><td>—</td><td>${fmt(r[2],dec)}${r[3]}</td></tr>`;
      const diff=r[2]-r[1], pct=r[1]?diff/r[1]*100:0;
      return `<tr><td>${r[0]}</td><td>${fmt(r[1],dec)}${r[3]}</td>`+
             `<td class="${diff>=0?'up':'down'}">${diff>=0?'▲':'▼'} ${Math.abs(pct).toFixed(1)}%</td>`+
             `<td>${fmt(r[2],dec)}${r[3]}</td></tr>`;
    }).join('') + '</tbody></table>';
  const gl = guNames();
  const cnt = gl.map(g=>({name:g, value:RF(((n.biz_gu||{})[g]||[])[0])}))

  verticalBars('startupWorkers', inds, {color:'#55b9c6', unit:'명', rotate:true});
  downloads.startupCount = cnt;
}

  function rankedDistricts(key,year,min,max){return districtData(key,year,min,max).sort((a,b)=>b.value-a.value)}
  function focusData(data){const idx=data.findIndex(x=>x.name===state.district);const picked=[data[idx],...data.filter((_,i)=>i!==idx).slice(0,9)];return picked.filter(Boolean)}
  function drawMap(id,data,unit,onClick,decimals=0){
  const el=document.getElementById(id); if(!el)return;
  if(!data.length){ el.innerHTML='<div class="map-na">해당 지역의 자료가 없습니다.</div>'; return; }
  const nums=data.map(x=>x.value), min=Math.min(...nums), max=Math.max(...nums);
  const colors=['#fff4cf','#fee18b','#f9bd38','#ff9671','#ef6368'];
  const color=v=>colors[Math.min(4,Math.floor((v-min)/((max-min)||1)*5))];
  const rows=[...data].sort((a,b)=>b.value-a.value);
  const W=1000, rowH=Math.max(16, Math.min(26, 560/rows.length)), H=rows.length*rowH+34;
  const L=170, R=110, bw=W-L-R;
  let s=`<span class="map-hint">막대를 클릭해 ${SHORT[SD]} 시군구를 선택 · 다시 클릭하면 해제</span>`;
  s+=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${SHORT[SD]} 시군구 ${unit}">`;
  rows.forEach((d,i)=>{
    const y=18+i*rowH, w=Math.max(2, bw*(d.value-min)/((max-min)||1)*0.94+bw*0.06);
    const on=state.district===d.name;
    s+=`<text x="${L-10}" y="${y+rowH*0.62}" text-anchor="end" font-size="${Math.min(13,rowH*0.62)}"
         font-weight="${on?800:500}" fill="${on?'#d24b3f':'#4a545c'}">${d.name}</text>`;
    s+=`<rect class="district ${on?'is-selected':''}" tabindex="0" role="button"
         data-name="${d.name}" data-tip="${d.name} ${fmt(d.value,decimals)}${unit}"
         x="${L}" y="${y+rowH*0.14}" width="${w}" height="${rowH*0.7}" rx="4"
         fill="${color(d.value)}" stroke="${on?'#d24b3f':'#e2d7bb'}" stroke-width="${on?2:.8}"
         style="cursor:pointer"/>`;
    s+=`<text x="${L+w+8}" y="${y+rowH*0.62}" font-size="${Math.min(12,rowH*0.58)}"
         fill="#5a6470">${fmt(d.value,decimals)}${unit}</text>`;
  });
  el.innerHTML = s+'</svg>';
  el.querySelectorAll('rect.district').forEach(r=>{
    r.addEventListener('click', ()=>onClick && onClick(r.dataset.name));
    r.addEventListener('keydown', e=>{ if(e.key==='Enter') onClick && onClick(r.dataset.name); });
  });
}
  function verticalBars(id,data,opt={}){
