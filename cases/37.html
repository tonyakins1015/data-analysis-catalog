<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>전국 종합지표 데이터 포털 | 전국 지표 3D 지형도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{
    --bg-1:#FAF9FF;
    --bg-2:#F1EEFC;
    --panel:rgba(255,255,255,0.86);
    --panel-solid:#FFFFFF;
    --line:rgba(120,105,190,0.14);
    --text-main:#221D3B;
    --text-dim:#6E6890;
    --text-faint:#9C97B8;
    --violet:#8B5CF6;
    --violet-deep:#6D3FE0;
    --teal:#17B8AC;
    --amber:#FFA531;
    --coral:#FF6270;
    --blue:#4E9BFF;
    --shadow: 0 10px 32px rgba(109,63,224,0.12);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background: radial-gradient(120% 140% at 50% -10%, var(--bg-2) 0%, var(--bg-1) 55%, #FFFFFF 100%);
    color:var(--text-main);
    font-family:'Pretendard', -apple-system, sans-serif;
    overflow:hidden;
  }
  .display{ font-family:'Space Grotesk', 'Pretendard', sans-serif; }
  .mono{ font-family:'JetBrains Mono', monospace; }

  #stage{ position:fixed; inset:0; width:100%; height:100%; display:block; }

  .vignette{
    position:fixed; inset:0; pointer-events:none; z-index:5;
    background:
      radial-gradient(140% 100% at 50% 100%, rgba(109,63,224,0.06) 0%, rgba(255,255,255,0) 55%),
      radial-gradient(90% 60% at 50% 0%, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0) 60%);
  }

  /* ---------- Top bar ---------- */
  .topbar{
    position:fixed; top:0; left:0; right:0; z-index:20;
    display:flex; align-items:center; justify-content:space-between;
    padding:22px 30px 0 30px;
    pointer-events:none;
  }
  .brand{ display:flex; flex-direction:column; gap:4px; pointer-events:auto; }
  .brand .eyebrow{
    font-size:11px; letter-spacing:0.22em; color:var(--violet-deep);
    text-transform:uppercase; font-weight:700;
  }
  .brand h1{
    margin:0; font-size:22px; font-weight:700; letter-spacing:-0.01em; color:var(--text-main);
    display:flex; align-items:baseline; gap:10px;
  }
  .brand h1 span.sub{ font-size:12px; font-weight:400; color:var(--text-dim); font-family:'Pretendard'; }
  .badge{
    pointer-events:auto;
    display:flex; align-items:center; gap:8px;
    background:var(--panel); border:1px solid var(--line);
    padding:9px 16px; border-radius:100px; backdrop-filter:blur(14px);
    font-size:12px; color:var(--text-dim); box-shadow:var(--shadow);
  }
  .badge .dot{ width:7px; height:7px; border-radius:50%; background:var(--teal); box-shadow:0 0 8px var(--teal); animation:pulse 2s infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.35;} }

  /* ---------- Left rail (indicators) ---------- */
  .rail{
    position:fixed; top:96px; left:24px; bottom:150px; z-index:20;
    width:238px; overflow-y:auto;
    display:flex; flex-direction:column; gap:16px;
    padding-right:4px;
  }
  .rail::-webkit-scrollbar{ width:4px; }
  .rail::-webkit-scrollbar-thumb{ background:var(--line); border-radius:4px; }
  .rail-group-label{
    font-size:10.5px; letter-spacing:0.16em; color:var(--text-faint);
    text-transform:uppercase; font-weight:700; margin:2px 0 -6px 4px;
  }
  .ind-btn{
    display:flex; align-items:center; gap:10px;
    background:var(--panel); border:1px solid var(--line);
    border-radius:12px; padding:10px 12px; cursor:pointer;
    backdrop-filter:blur(14px); text-align:left;
    transition:border-color .18s ease, transform .18s ease, background .18s ease, box-shadow .18s ease;
    color:var(--text-main); box-shadow:0 2px 10px rgba(109,63,224,0.05);
  }
  .ind-btn:hover{ transform:translateX(3px); border-color:rgba(139,92,246,0.35); }
  .ind-btn .icon{
    width:30px; height:30px; border-radius:9px; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center; font-size:15px;
    background:rgba(139,92,246,0.08);
  }
  .ind-btn .label{ font-size:12.5px; font-weight:600; line-height:1.3; }
  .ind-btn.active{
    border-color:var(--violet);
    background:linear-gradient(135deg, rgba(139,92,246,0.14), rgba(23,184,172,0.08));
    box-shadow:0 0 0 1px rgba(139,92,246,0.3), 0 10px 26px rgba(139,92,246,0.16);
  }
  .ind-btn.active .icon{ background:rgba(139,92,246,0.22); }

  /* ---------- Right detail panel ---------- */
  .panel{
    position:fixed; top:96px; right:24px; bottom:150px; z-index:20;
    width:296px;
    background:var(--panel); border:1px solid var(--line); border-radius:20px;
    backdrop-filter:blur(18px); box-shadow:var(--shadow);
    padding:20px 20px 16px 20px;
    display:flex; flex-direction:column; gap:16px;
    overflow-y:auto;
  }
  .panel::-webkit-scrollbar{ width:4px; }
  .panel::-webkit-scrollbar-thumb{ background:var(--line); border-radius:4px; }
  .panel h2{ margin:0; font-size:17px; font-weight:700; letter-spacing:-0.01em; }
  .panel .unit-tag{ font-size:11px; color:var(--text-dim); margin-top:2px; display:block; }
  .legend{ display:flex; flex-direction:column; gap:6px; }
  .legend-bar{ height:8px; border-radius:8px; background:linear-gradient(90deg, var(--teal), var(--blue), var(--violet), var(--amber), var(--coral)); }
  .legend-labels{ display:flex; justify-content:space-between; font-size:10px; color:var(--text-faint); }
  .divider{ height:1px; background:var(--line); margin:2px 0; }
  .rank-section h3{ margin:0 0 8px 0; font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-faint); font-weight:700; }
  .rank-row{ display:flex; align-items:center; gap:8px; padding:6px 0; font-size:12.5px; cursor:pointer; border-radius:8px; }
  .rank-row:hover{ background:rgba(139,92,246,0.06); }
  .rank-row .rank-no{ width:16px; color:var(--text-faint); font-size:11px; }
  .rank-row .rank-name{ flex:1; }
  .rank-row .rank-val{ color:var(--text-dim); font-size:11.5px; font-weight:600; }
  .rank-row.top .rank-val{ color:var(--coral); }
  .rank-row.bottom .rank-val{ color:var(--teal); }

  .selected-card{
    background:rgba(139,92,246,0.08); border:1px solid rgba(139,92,246,0.28);
    border-radius:14px; padding:14px; display:none; flex-direction:column; gap:4px;
  }
  .selected-card.show{ display:flex; }
  .selected-card .name{ font-size:15px; font-weight:700; }
  .selected-card .val{ font-size:24px; font-weight:700; color:var(--violet-deep); }
  .selected-card .meta{ font-size:11px; color:var(--text-dim); }

  /* ---------- Timeline footer ---------- */
  .timeline{
    position:fixed; left:24px; right:24px; bottom:24px; z-index:20;
    background:var(--panel); border:1px solid var(--line); border-radius:18px;
    backdrop-filter:blur(18px); box-shadow:var(--shadow);
    padding:14px 22px; display:flex; align-items:center; gap:18px;
  }
  .play-btn{
    width:40px; height:40px; border-radius:50%; border:none; cursor:pointer;
    background:linear-gradient(135deg, var(--violet), var(--blue));
    color:white; font-size:14px; display:flex; align-items:center; justify-content:center;
    flex:0 0 auto; box-shadow:0 6px 18px rgba(139,92,246,0.35);
  }
  .timeline-track{ flex:1; display:flex; flex-direction:column; gap:8px; }
  .timeline-top{ display:flex; justify-content:space-between; align-items:baseline; }
  .timeline-top .yr{ font-size:22px; font-weight:700; color:var(--violet-deep); }
  .timeline-top .yr-range{ font-size:11px; color:var(--text-faint); }
  input[type=range]{ -webkit-appearance:none; width:100%; height:4px; border-radius:4px; background:var(--line); outline:none; }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:16px; height:16px; border-radius:50%;
    background:#fff; border:3px solid var(--violet); cursor:pointer;
    box-shadow:0 0 10px rgba(139,92,246,0.5);
  }
  .hint{ flex:0 0 auto; font-size:11px; color:var(--text-faint); max-width:180px; text-align:right; line-height:1.4; }

  /* ---------- Mascot ---------- */
  .mascot-wrap{ position:fixed; right:344px; bottom:150px; z-index:19; pointer-events:none; display:flex; align-items:flex-end; gap:10px; }
  .speech{
    pointer-events:auto;
    background:var(--panel-solid); border:1px solid var(--line);
    padding:10px 14px; border-radius:14px 14px 4px 14px;
    font-size:12px; color:var(--text-main); max-width:190px;
    margin-bottom:34px; box-shadow:var(--shadow);
    opacity:0; transform:translateY(6px); transition:opacity .4s ease, transform .4s ease;
  }
  .speech.show{ opacity:1; transform:translateY(0); }
  .critter{ width:76px; height:76px; animation:float 3.4s ease-in-out infinite; filter:drop-shadow(0 10px 16px rgba(139,92,246,0.3)); }
  @keyframes float{ 0%,100%{ transform:translateY(0) rotate(-2deg); } 50%{ transform:translateY(-12px) rotate(2deg); } }

  /* Loading */
  #loading{
    position:fixed; inset:0; z-index:100; background:var(--bg-1);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    transition:opacity .6s ease;
  }
  #loading .spinner{
    width:34px; height:34px; border-radius:50%;
    border:3px solid rgba(139,92,246,0.15); border-top-color:var(--violet);
    animation:spin 0.9s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  #loading p{ color:var(--text-dim); font-size:13px; }

  @media (max-width: 980px){
    .rail{ width:170px; }
    .panel{ width:230px; }
    .mascot-wrap{ display:none; }
  }
</style>
</head>

<div id="loading"><div class="spinner"></div><p>전국 지형 데이터를 불러오는 중…</p></div>

<canvas id="stage"></canvas>
<div class="vignette"></div>

<header class="topbar">
  <div class="brand">
    <span class="eyebrow">National Public Data Terrain</span>
    <h1>전국 종합지표 데이터 포털 <span class="sub">e-지방지표 기반 전국 3D 지형 시각화</span></h1>
  </div>

</header>

<aside class="rail" id="rail"></aside>

<section class="panel">

    <span class="val mono" id="selVal">-</span>
    <span class="meta" id="selMeta">-</span>

  <div class="rank-section">

  </div>
  <div class="rank-section">

</section>

<div class="mascot-wrap">
  <div class="speech" id="speech"></div>

    <circle cx="40" cy="54" r="2.4" fill="#fff"/>
    <circle cx="64" cy="54" r="2.4" fill="#fff"/>
    <path d="M40 72 Q50 80 60 72" stroke="#241D3D" stroke-width="3" fill="none" stroke-linecap="round"/>
    <ellipse cx="24" cy="66" rx="7" ry="5" fill="#A78BFA"/>
    <ellipse cx="76" cy="66" rx="7" ry="5" fill="#A78BFA"/>
  </svg>
</div>

<footer class="timeline">
  <button class="play-btn" id="playBtn">▶</button>
  <div class="timeline-track">
    <div class="timeline-top">
      <span class="yr display mono" id="yearLabel">2024</span>
      <span class="yr-range mono" id="yearRange">2010 – 2024</span>
    </div>
    <input type="range" id="yearSlider" min="0" max="10" step="1" value="10">
  </div>
  <div class="hint">지도를 드래그하면 회전, 스크롤로 확대·축소할 수 있어요.</div>
</footer>

const GROUP_ORDER = ["인구·가구","삶의 만족","교육","환경","경제"];
const COLOR_STOPS = [0x17B8AC, 0x4E9BFF, 0x8B5CF6, 0xFFA531, 0xFF6270];

/* ============ Build indicator rail ============ */
const railEl = document.getElementById('rail');
let currentKey = "스트레스_인지율";
let currentYearIdx = 0;
let playing = false, playTimer = null;

function buildRail(){
  GROUP_ORDER.forEach(group=>{
    const label = document.createElement('div');
    label.className = 'rail-group-label';
    label.textContent = group;
    railEl.appendChild(label);
    Object.entries(META).filter(([k,v])=>v.group===group).forEach(([key, meta])=>{
      const btn = document.createElement('div');
      btn.className = 'ind-btn' + (key===currentKey ? ' active' : '');
      btn.dataset.key = key;
      btn.innerHTML = `<span class="icon">${meta.icon}</span><span class="label">${meta.label}</span>`;
      btn.addEventListener('click', ()=> selectIndicator(key));
      railEl.appendChild(btn);
    });
  });
}

function selectIndicator(key){
  currentKey = key;
  document.querySelectorAll('.ind-btn').forEach(b=> b.classList.toggle('active', b.dataset.key===key));
  const years = DATA[key].years;
  currentYearIdx = years.length - 1;
  setupYearSlider();
  refreshAll(true);
}

/* ============ Year slider ============ */
const yearSlider = document.getElementById('yearSlider');
const yearLabel  = document.getElementById('yearLabel');
const yearRange  = document.getElementById('yearRange');

function setupYearSlider(){
  const years = DATA[currentKey].years;
  yearSlider.min = 0;
  yearSlider.max = years.length - 1;
  yearSlider.value = currentYearIdx;
  yearRange.textContent = `${years[0]} – ${years[years.length-1]}`;
  yearLabel.textContent = years[currentYearIdx];
}
yearSlider.addEventListener('input', ()=>{
  currentYearIdx = parseInt(yearSlider.value, 10);
  yearLabel.textContent = DATA[currentKey].years[currentYearIdx];
  refreshAll(false);
});

document.getElementById('playBtn').addEventListener('click', ()=>{
  playing = !playing;
  document.getElementById('playBtn').textContent = playing ? '❚❚' : '▶';
  if(playing){
    playTimer = setInterval(()=>{
      const years = DATA[currentKey].years;
      currentYearIdx = (currentYearIdx + 1) % years.length;
      yearSlider.value = currentYearIdx;
      yearLabel.textContent = years[currentYearIdx];
      refreshAll(false);
    }, 1100);
  } else {
    clearInterval(playTimer);
  }
});

/* ============ Number formatting & stats ============ */
function fmt(v, key){
  if(v === null || v === undefined) return "자료없음";
  const d = META[key].decimals;
  return v.toLocaleString('ko-KR', { minimumFractionDigits:d, maximumFractionDigits:d });
}

function getDomain(key){
  let min = Infinity, max = -Infinity;
  const regions = DATA[key].regions;
  Object.values(regions).forEach(arr=>{
    arr.forEach(v=>{ if(v!==null){ if(v<min) min=v; if(v>max) max=v; } });
  });
  return { min, max };
}
const domainCache = {};
function domainOf(key){
  if(!domainCache[key]) domainCache[key] = getDomain(key);
  return domainCache[key];
}

function colorForValue(v, min, max){
  if(v === null) return new THREE.Color(0xD8D3EC);
  const t = max>min ? (v-min)/(max-min) : 0.5;
  const seg = Math.min(COLOR_STOPS.length - 2, Math.floor(t * (COLOR_STOPS.length-1)));
  const localT = (t*(COLOR_STOPS.length-1)) - seg;
  const c1 = new THREE.Color(COLOR_STOPS[seg]);
  const c2 = new THREE.Color(COLOR_STOPS[seg+1]);
  return c1.lerp(c2, localT);
}

/* ============ THREE.JS SCENE ============ */
const canvas = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xFAF9FF);
scene.fog = new THREE.FogExp2(0xFAF9FF, 0.018);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth/window.innerHeight, 0.1, 200);
camera.position.set(0, 15, 17);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.5, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI * 0.47;
controls.minDistance = 8;
controls.maxDistance = 30;
controls.update();

/* Lights */
scene.add(new THREE.AmbientLight(0xFFFFFF, 0.95));
const key = new THREE.DirectionalLight(0xFFFBF2, 1.5);
key.position.set(8, 16, 6);
key.castShadow = true;
key.shadow.mapSize.set(2048,2048);
key.shadow.camera.left=-16; key.shadow.camera.right=16;
key.shadow.camera.top=16; key.shadow.camera.bottom=-16;
scene.add(key);
const rim = new THREE.DirectionalLight(0x8B5CF6, 0.35);
rim.position.set(-10,6,-8);
scene.add(rim);

/* Ocean plate */
function makeOceanTexture(){
  const size = 512;
  const c = document.createElement('canvas'); c.width=c.height=size;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#4FC7E3'; ctx.fillRect(0,0,size,size);
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  const step = 26;
  for(let y=0;y<size;y+=step){
    for(let x=0;x<size;x+=step){
      const r = 2.4 + Math.random()*1.6;
      ctx.beginPath();
      ctx.arc(x + (Math.random()-0.5)*8, y + (Math.random()-0.5)*8, r, 0, Math.PI*2);
      ctx.fill();
    }
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(5,5);
  return tex;
}
const oceanGeo = new THREE.CircleGeometry(30, 64);
const oceanMat = new THREE.MeshStandardMaterial({ map: makeOceanTexture(), color:0xffffff, metalness:0.1, roughness:0.75 });
const ocean = new THREE.Mesh(oceanGeo, oceanMat);
ocean.rotation.x = -Math.PI/2;
ocean.position.y = -0.42;
ocean.receiveShadow = true;
scene.add(ocean);

const ringGeo = new THREE.RingGeometry(9.6, 9.9, 96);
const ringMat = new THREE.MeshBasicMaterial({ color:0xffffff, transparent:true, opacity:0.55, side:THREE.DoubleSide });
const ring = new THREE.Mesh(ringGeo, ringMat);
ring.rotation.x = -Math.PI/2; ring.position.y = -0.40;
scene.add(ring);

/* ============ Real province polygons (island base, constant height) ============ */
const K = 15.0;
const lat0 = 36.4, lon0 = 127.8;
function project(lat, lon){
  const x = (lon - lon0) * Math.cos(lat0*Math.PI/180) * K / 5.0;
  const z = -(lat - lat0) * K / 5.0;
  return { x, z };
}

const NAME_MAP = {
  "서울특별시":"서울", "부산광역시":"부산", "대구광역시":"대구", "인천광역시":"인천",
  "광주광역시":"광주", "대전광역시":"대전", "울산광역시":"울산", "세종특별자치시":"세종",
  "경기도":"경기", "강원도":"강원", "강원특별자치도":"강원",
  "충청북도":"충북", "충청남도":"충남",
  "전라북도":"전북", "전북특별자치도":"전북", "전라남도":"전남",
  "경상북도":"경북", "경상남도":"경남", "제주특별자치도":"제주"
};

const ISLAND_H = 0.45;
const regionMeshes = {}; // key -> { pinGroup, cylinder, sphere, capMaterial, targetHeight, currentHeight }
const allClickable = [];

function makeLabelSprite(text){
  const c = document.createElement('canvas');
  const scale = 3;
  c.width = 320*scale; c.height = 120*scale;
  const ctx = c.getContext('2d');
  ctx.scale(scale, scale);
  ctx.font = '700 44px Pretendard, sans-serif';
  const textW = ctx.measureText(text).width;
  const padX = 30, h = 74, w = textW + padX*2;
  const x = (320-w)/2, y = (120-h)/2, r = h/2;
  ctx.shadowColor = 'rgba(109,63,224,0.25)';
  ctx.shadowBlur = 16;
  ctx.shadowOffsetY = 5;
  ctx.fillStyle = '#FFFFFF';
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = 'rgba(139,92,246,0.25)';
  ctx.stroke();
  ctx.shadowColor = 'transparent';
  ctx.fillStyle = '#221D3B';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, 320/2, y+h/2+2);
  const tex = new THREE.CanvasTexture(c);
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  tex.colorSpace = THREE.SRGBColorSpace;
  const mat = new THREE.SpriteMaterial({ map: tex, depthTest:false, transparent:true });
  const sp = new THREE.Sprite(mat);
  sp.scale.set(w/320*2.6, h/320*2.6, 1);
  return sp;
}

function ringToShapePoints(ring){
  return ring.map(([lon,lat])=>{
    const { x, z } = project(lat, lon);
    return new THREE.Vector2(x, -z);
  });
}

function polygonArea(pts){
  let a = 0;
  for(let i=0;i<pts.length;i++){
    const p1 = pts[i], p2 = pts[(i+1)%pts.length];
    a += p1.x*p2.y - p2.x*p1.y;
  }
  return Math.abs(a/2);
}

const islandCapMat = new THREE.MeshStandardMaterial({ color:0xC9BFEA, metalness:0.15, roughness:0.55 });
const islandSideMat = new THREE.MeshStandardMaterial({ color:0xB2A9CC, metalness:0.1, roughness:0.85 });
const cylGeom = new THREE.CylinderGeometry(0.075, 0.095, 1, 10);
cylGeom.translate(0, 0.5, 0);
const sphGeom = new THREE.SphereGeometry(0.24, 20, 20);

async function buildRegions(){
  // Simplified, topologically-clean province boundaries (real KOSTAT 2018 admin geometry, mapshaper-simplified for robustness)
  const topoUrl = 'https://raw.githubusercontent.com/southkorea/southkorea-maps/master/kostat/2018/json/skorea-provinces-2018-topo-simple.json';
  const resp = await fetch(topoUrl);
  const topo = await resp.json();
  const objKey = Object.keys(topo.objects)[0];
  const geo = topoFeature(topo, topo.objects[objKey]);

  geo.features.forEach(f=>{
    const fullName = f.properties.name;
    const key = NAME_MAP[fullName];
    if(!key) return;

    const polygons = f.geometry.type === 'Polygon' ? [f.geometry.coordinates] : f.geometry.coordinates;
    const islandGroup = new THREE.Group();
    islandGroup.userData.region = key;

    let biggestArea = -1, labelPos = new THREE.Vector2(0,0);

    polygons.forEach(rings=>{
      const outerPts = ringToShapePoints(rings[0]);
      const shape = new THREE.Shape(outerPts);
      for(let i=1;i<rings.length;i++){
        shape.holes.push(new THREE.Path(ringToShapePoints(rings[i])));
      }
      const geomEx = new THREE.ExtrudeGeometry(shape, { depth:ISLAND_H, bevelEnabled:false, curveSegments:2 });
      geomEx.rotateX(-Math.PI/2);
      const mesh = new THREE.Mesh(geomEx, [islandSideMat, islandCapMat]);
      mesh.castShadow = true; mesh.receiveShadow = true;
      mesh.userData.region = key;
      islandGroup.add(mesh);
      allClickable.push(mesh);

      const area = polygonArea(outerPts);
      if(area > biggestArea){
        biggestArea = area;
        let cx=0, cy=0;
        outerPts.forEach(p=>{ cx+=p.x; cy+=p.y; });
        labelPos.set(cx/outerPts.length, cy/outerPts.length);
      }
    });
    scene.add(islandGroup);

    // data pin: cylinder + sphere cap, rooted at island top, at region centroid
    const capMaterial = new THREE.MeshStandardMaterial({ color:0x8B5CF6, metalness:0.35, roughness:0.3, emissive:0x2a1550, emissiveIntensity:0.25 });
    const cylinder = new THREE.Mesh(cylGeom, capMaterial);
    cylinder.castShadow = true;
    const sphere = new THREE.Mesh(sphGeom, capMaterial);
    sphere.castShadow = true;

    const pinGroup = new THREE.Group();
    pinGroup.position.set(labelPos.x, ISLAND_H, -labelPos.y);
    pinGroup.userData.region = key;
    pinGroup.add(cylinder);
    pinGroup.add(sphere);
    scene.add(pinGroup);
    allClickable.push(cylinder, sphere);

    const label = makeLabelSprite(key);
    label.position.set(labelPos.x, ISLAND_H + 0.35, -labelPos.y);
    scene.add(label);

    regionMeshes[key] = { pinGroup, cylinder, sphere, capMaterial, targetHeight:1, currentHeight:1, label };
  });
}

/* ============ Raycasting / selection ============ */
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let selectedRegion = null;

renderer.domElement.addEventListener('pointerdown', (e)=>{
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(allClickable);
  if(hits.length){
    let obj = hits[0].object;
    selectedRegion = obj.userData.region;
    updateSelectedCard();
  }
});

/* ============ Panel: rank lists & selected card ============ */
const panelTitle = document.getElementById('panelTitle');
const panelUnit = document.getElementById('panelUnit');
const topList = document.getElementById('topList');
const bottomList = document.getElementById('bottomList');
const selectedCard = document.getElementById('selectedCard');

function updateSelectedCard(){
  if(!selectedRegion) { selectedCard.classList.remove('show'); return; }
  const ind = DATA[currentKey];
  const v = ind.regions[selectedRegion][currentYearIdx];
  document.getElementById('selName').textContent = selectedRegion;
  document.getElementById('selVal').textContent = fmt(v, currentKey) + (ind.unit ? ' ' + ind.unit : '');
  document.getElementById('selMeta').textContent = `${ind.years[currentYearIdx]}년 · ${META[currentKey].label}`;
  selectedCard.classList.add('show');
}

function refreshAll(resetSelection){
  const ind = DATA[currentKey];
  const meta = META[currentKey];
  const { min, max } = domainOf(currentKey);
  panelTitle.textContent = meta.label;
  panelUnit.textContent = `단위: ${ind.unit || '-'}  ·  ${ind.years[currentYearIdx]}년 기준`;

  const values = Object.entries(ind.regions).map(([name, arr])=>({ name, v: arr[currentYearIdx] }))
    .filter(o=>o.v !== null);
  const sorted = [...values].sort((a,b)=> b.v - a.v);
  const top5 = sorted.slice(0,5);
  const bottom5 = sorted.slice(-5).reverse();

  topList.innerHTML = top5.map((o,i)=>`<div class="rank-row top" data-name="${o.name}"><span class="rank-no">${i+1}</span><span class="rank-name">${o.name}</span><span class="rank-val mono">${fmt(o.v,currentKey)}</span></div>`).join('');
  bottomList.innerHTML = bottom5.map((o,i)=>`<div class="rank-row bottom" data-name="${o.name}"><span class="rank-no">${i+1}</span><span class="rank-name">${o.name}</span><span class="rank-val mono">${fmt(o.v,currentKey)}</span></div>`).join('');

  document.querySelectorAll('.rank-row').forEach(row=>{
    row.addEventListener('click', ()=>{ selectedRegion = row.dataset.name; updateSelectedCard(); });
  });

  const MIN_H = 0.22, MAX_H = 2.6;
  Object.entries(regionMeshes).forEach(([name, obj])=>{
    const v = ind.regions[name] ? ind.regions[name][currentYearIdx] : null;
    let h = MIN_H;
    if(v !== null && max > min){ h = MIN_H + (v-min)/(max-min) * (MAX_H-MIN_H); }
    else if(v !== null){ h = (MIN_H+MAX_H)/2; }
    obj.targetHeight = h;
    const col = colorForValue(v, min, max);
    obj.capMaterial.color.copy(col);
    obj.capMaterial.emissive.copy(col).multiplyScalar(0.18);
  });

  if(resetSelection){ selectedRegion = null; updateSelectedCard(); }
  else if(selectedRegion){ updateSelectedCard(); }
}

/* ============ Animation loop ============ */
function animate(){
  requestAnimationFrame(animate);
  Object.values(regionMeshes).forEach(obj=>{
    obj.currentHeight += (obj.targetHeight - obj.currentHeight) * 0.09;
    obj.cylinder.scale.y = obj.currentHeight;
    obj.sphere.position.y = obj.currentHeight;
    obj.label.position.y = ISLAND_H + obj.currentHeight + 0.35;
  });
  ring.rotation.z += 0.0009;
  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ============ Mascot speech ============ */
const tips = [
  "타임라인의 재생 버튼을 누르면 연도별 변화를 한눈에 볼 수 있어요.",
  "지형을 드래그하면 원하는 각도에서 살펴볼 수 있어요.",
  "지역 구슬을 클릭하면 정확한 수치를 확인할 수 있어요.",
  "왼쪽에서 다른 지표를 선택해 비교해보세요.",
  "구슬이 높이 솟을수록, 색이 붉을수록 값이 큰 지역이에요."
];
const speechEl = document.getElementById('speech');
let tipIdx = 0;
function showTip(){
  speechEl.textContent = tips[tipIdx % tips.length];
  speechEl.classList.add('show');
  tipIdx++;
  setTimeout(()=> speechEl.classList.remove('show'), 5200);
}

/* ============ Init ============ */
buildRail();
setupYearSlider();

(async ()=>{
  try{
    await buildRegions();
  } catch(err){
    console.error('지형 데이터를 불러오지 못했습니다', err);
    document.querySelector('#loading p').textContent = '지형 데이터를 불러오지 못했습니다. 새로고침 해주세요.';
    return;
  }
  refreshAll(true);
  animate();
  setTimeout(showTip, 1200);
  setInterval(showTip, 8000);

  document.getElementById('loading').style.opacity = '0';
  setTimeout(()=> document.getElementById('loading').style.display='none', 650);
})();
</script>
