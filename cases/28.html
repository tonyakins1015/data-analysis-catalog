<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>전국 반려동물 데이터 허브 | PET DATA HUB</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --ink:#0F1D23; --ink-2:#33474F; --muted:#6B818A; --faint:#9BAAB1;
  --brand:#0C4A5A; --brand-2:#17879B; --brand-3:#3FA8B8;
  --amber:#D98324; --amber-l:#FBF1E4;
  --line:#DBE4E7; --line-2:#EDF2F3; --bg:#F1F4F5; --card:#FFFFFF;
  --alert:#B4451F; --alert-l:#FBEDE7;
  --q1:#E6EFF1; --q2:#B9D6DC; --q3:#86BAC5; --q4:#4E9AAA; --q5:#17879B;
  --mono:"SFMono-Regular",ui-monospace,Menlo,Consolas,monospace;
  --rad:5px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg); color:var(--ink); font-size:14px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.n{font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.03em}
.eyebrow{
  font:600 10px/1 var(--mono); letter-spacing:.16em; text-transform:uppercase; color:var(--faint);
}
.wrap{max-width:1620px; margin:0 auto; padding:0 24px}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--brand-2); outline-offset:2px}

/* ============ 상단 ============ */
.topbar{background:var(--brand); color:#fff}
.topbar .wrap{display:flex; align-items:center; gap:26px; height:60px}
.brand{display:flex; align-items:center; gap:11px; text-decoration:none; color:#fff}
.mark{
  width:32px; height:32px; border-radius:8px; background:var(--brand-2);
  display:grid; place-items:center; font:800 15px/1 Pretendard; color:#052730;
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.18);
}
.brand .t1{font:800 16px/1.1 Pretendard; letter-spacing:-.03em}
.brand .t2{font:600 9px/1 var(--mono); letter-spacing:.18em; color:#8FC4CE}
.topnav{display:flex; gap:2px; margin-left:auto}
.topnav a{
  color:#BEDDE3; text-decoration:none; font-size:13px; font-weight:600;
  padding:7px 12px; border-radius:4px;
}
.topnav a:hover{background:rgba(255,255,255,.10); color:#fff}
.topnav a.on{background:rgba(255,255,255,.14); color:#fff}

/* ============ 시그니처: 데이터 파이프라인 원장 ============ */
.ledger{background:#08333F; color:#fff; border-bottom:1px solid rgba(255,255,255,.08)}
.ledger .wrap{display:flex; align-items:stretch; gap:0; overflow-x:auto; padding:0 24px}
.ledger .lhead{
  display:flex; flex-direction:column; justify-content:center; padding:11px 20px 11px 0;
  border-right:1px solid rgba(255,255,255,.10); margin-right:16px; flex:none;
}
.ledger .lhead .eyebrow{color:#6FA5B1}
.ledger .lhead b{font:700 12px/1.5 Pretendard; color:#DCEDF0; white-space:nowrap}
.src{
  flex:none; padding:11px 16px; border-right:1px solid rgba(255,255,255,.07);
  min-width:150px; position:relative;
}
.src:last-child{border-right:0}
.src .sn{font:600 11px/1.4 Pretendard; color:#CFE4E8; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:190px}
.src .sv{font:700 15px/1.2 var(--mono); color:#fff; letter-spacing:-.03em; margin-top:2px}
.src .sd{font:10px/1.4 var(--mono); color:#6FA5B1; letter-spacing:.02em}
.src::before{
  content:""; position:absolute; left:16px; top:0; width:22px; height:2px; background:var(--brand-3);
}
.src.warn::before{background:var(--amber)}

/* ============ 탭 ============ */
.tabs{background:#fff; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:600}
.tabs .wrap{display:flex; gap:0; overflow-x:auto}
.tabs button{
  appearance:none; background:none; border:0; cursor:pointer; white-space:nowrap;
  font:700 14px/1 Pretendard; color:var(--muted); padding:16px 20px 13px;
  border-bottom:3px solid transparent; letter-spacing:-.02em;
}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected=true]{color:var(--brand); border-bottom-color:var(--brand-2)}
.tabs button .c{font:600 10px/1 var(--mono); color:var(--faint); margin-left:6px}
.tabs button[aria-selected=true] .c{color:var(--brand-3)}

/* ============ 필터 ============ */
.filterbar{background:#fff; border-bottom:1px solid var(--line)}
.filterbar .wrap{display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding-top:11px; padding-bottom:11px}
.filterbar label{font:600 11px/1 var(--mono); letter-spacing:.08em; color:var(--faint); text-transform:uppercase}
select, input[type=search]{
  font:14px Pretendard; color:var(--ink); background:#fff; border:1px solid var(--line);
  border-radius:4px; padding:7px 11px; min-width:132px;
}
select:hover, input:hover{border-color:var(--brand-3)}
.pill{
  font:600 11px/1 var(--mono); background:var(--line-2); color:var(--ink-2);
  padding:6px 10px; border-radius:20px; letter-spacing:.02em;
}

/* ============ 카드 ============ */
main{padding:20px 0 70px}
.panel{display:none}
.panel.on{display:block}
.row{display:grid; gap:14px; margin-bottom:14px; align-items:start}
.r-4{grid-template-columns:repeat(4,1fr)}
.r-32{grid-template-columns:minmax(0,1.1fr) minmax(0,2fr)}
.r-23{grid-template-columns:minmax(0,2fr) minmax(0,1.1fr)}
.r-2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(max-width:1180px){.r-4{grid-template-columns:repeat(2,1fr)} .r-32,.r-23,.r-2{grid-template-columns:1fr}}
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--rad); display:flex; flex-direction:column}
.card > header{
  padding:12px 16px; border-bottom:1px solid var(--line-2);
  display:flex; align-items:center; gap:10px; flex:none;
}
.card > header h3{margin:0; font:700 13px/1.3 Pretendard; letter-spacing:-.02em; color:var(--ink)}
.card > header .meta{margin-left:auto; font:10px/1.4 var(--mono); color:var(--faint); letter-spacing:.02em; text-align:right}
.card .body{padding:16px; flex:1; min-width:0}
.card .body.flush{padding:0}

/* KPI */
.kpi{padding:16px 18px}
.kpi .eyebrow{display:block; margin-bottom:9px}
.kpi .v{font:800 34px/1 var(--mono); letter-spacing:-.045em; color:var(--brand)}
.kpi .u{font:600 12px/1 Pretendard; color:var(--muted); margin-left:5px; letter-spacing:0}
.kpi .sub{margin-top:9px; font-size:12px; color:var(--muted)}
.kpi .sub b{color:var(--ink-2); font-weight:700}
.kpi.amber .v{color:var(--amber)}
.spark{display:flex; gap:2px; height:4px; margin-top:11px; border-radius:2px; overflow:hidden}

/* 지도 */
.map{height:100%; min-height:480px; background:#DFE7E9; border-radius:0 0 var(--rad) var(--rad)}
.legend{display:flex; flex-wrap:wrap; gap:12px; padding:10px 16px; border-top:1px solid var(--line-2); font-size:11px; color:var(--muted)}
.legend i{display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:5px; vertical-align:0}
.note{padding:9px 16px; border-top:1px solid var(--line-2); font-size:11px; color:var(--muted); line-height:1.6}
.note b{color:var(--alert)}

/* 표 */
.tw{overflow:auto; max-height:520px}
table{width:100%; border-collapse:collapse; font-size:13px}
th,td{padding:8px 12px; text-align:right; border-bottom:1px solid var(--line-2); white-space:nowrap}
th{
  position:sticky; top:0; background:#F7FAFA; z-index:2; cursor:pointer;
  font:700 10px/1.4 var(--mono); letter-spacing:.08em; color:var(--muted); text-transform:uppercase;
}
th:hover{color:var(--brand-2)}
th.l,td.l{text-align:left}
tbody tr{cursor:pointer}
tbody tr:hover{background:#F4F9FA}
tbody tr.sel{background:#E4F1F4; box-shadow:inset 3px 0 0 var(--brand-2)}
td.rk{font:600 10px/1 var(--mono); color:var(--faint)}
td b{font-weight:700}
.sw{display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:7px; vertical-align:-1px}
.dash{color:var(--faint)}

/* 바 리스트 */
.bars{display:flex; flex-direction:column; gap:9px}
.bar .t{display:flex; justify-content:space-between; align-items:baseline; font-size:12px; margin-bottom:4px}
.bar .t span:last-child{color:var(--muted)}
.bar .track{height:7px; background:var(--line-2); border-radius:4px; overflow:hidden; display:flex}
.bar .track i{display:block; height:7px}

/* 알림 */
.alert{
  background:var(--alert-l); border:1px solid #EED3C6; color:#8E3517;
  border-radius:var(--rad); padding:11px 14px; font-size:12.5px; line-height:1.65; margin-bottom:14px;
}
.alert b{font-weight:700}
.alert code{font:11px var(--mono); background:rgba(255,255,255,.7); padding:1px 5px; border-radius:3px}

/* 원장 표 */
.ledger-tbl td{white-space:normal; vertical-align:top; text-align:left}
.ledger-tbl td.n{white-space:nowrap; text-align:right}
.tagline{display:inline-block; font:600 10px/1.6 var(--mono); background:var(--line-2); color:var(--ink-2); padding:1px 7px; border-radius:3px; margin:1px 3px 1px 0}
.tagline.a{background:var(--amber-l); color:#8A5313}

/* 인천 카드 */
.icgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:12px}
.iccard{border:1px solid var(--line); border-radius:var(--rad); padding:13px 15px; background:#fff}
.iccard h4{margin:0 0 3px; font:700 14px/1.3 Pretendard}
.iccard .loc{font:11px/1.5 var(--mono); color:var(--faint); margin-bottom:8px}
.iccard dl{margin:0; display:grid; grid-template-columns:auto 1fr; gap:3px 10px; font-size:12px}
.iccard dt{color:var(--muted); font-weight:600; white-space:nowrap}
.iccard dd{margin:0; color:var(--ink-2)}

svg text{font-family:var(--mono); fill:var(--muted)}
.hidden{display:none!important}
footer{border-top:1px solid var(--line); background:#fff; padding:20px 0; font-size:11.5px; color:var(--muted)}
footer .wrap{display:flex; gap:20px; flex-wrap:wrap}
</style>
</head>

const dt = v => { const x=String(v||""); return /^\d{8}$/.test(x) ? x.slice(0,4)+"-"+x.slice(4,6)+"-"+x.slice(6) : x; };
const S = { tab:"sum", sido:"", sgg:null, q:"", layers:new Set(["vet"]), ggYear:D.ggYear, maps:{}, view:{}, fit:false };
let SIDOS = [...new Set(D.regions.map(r=>r.sido))].sort();

/* ---------- 공통 계산 ---------- */
function regions(){
  let rs = D.regions;
  if(S.sido) rs = rs.filter(r=>r.sido===S.sido);
  if(S.q) rs = rs.filter(r=>(r.sgg+r.sido).includes(S.q));
  return rs;
}
const sum = (rs,f) => rs.reduce((a,r)=>a+(f(r)||0),0);
function quant(vals){
  const v = vals.filter(x=>x!==null&&x!==undefined&&!isNaN(x)&&x>0).sort((a,b)=>a-b);
  if(v.length<5) return null;
  return [.2,.4,.6,.8].map(p=>v[Math.floor(v.length*p)]);
}
function qi(x,br){ if(!br||x===null||x===undefined||!x) return -1;
  for(let i=0;i<4;i++) if(x<=br[i]) return i; return 4; }

/* ---------- 차트 유틸 ---------- */
function hbars(items, opts={}){
  const max = Math.max(...items.map(i=>i.v||0), 1);
  return `<div class="bars">` + items.map(i=>{
    const segs = i.segs || [{v:i.v, c:opts.color||C("--brand-2")}];
    if(i.none) return `<div class="bar"><div class="t"><span style="color:var(--faint)">${i.k}</span>
      <span style="font-size:11px;color:var(--faint)">2022 등록자료에 해당 구역 없음</span></div>
      <div class="track"></div></div>`;
    return `<div class="bar"><div class="t"><span>${i.k}</span>
      <span class="n">${opts.dec?nf2(i.v,opts.dec):nf(i.v)}${opts.unit||""}</span></div>
      <div class="track">${segs.map(s=>`<i style="width:${(s.v/max*100).toFixed(2)}%;background:${s.c}"></i>`).join("")}</div></div>`;
  }).join("") + `</div>`;
}
function lineChart(rows, opts={}){
  const W=560,H=200,P={l:40,r:14,t:14,b:26};
  const xs = rows.map(r=>r[0]);
  const series = opts.series;
  const max = Math.max(...rows.flatMap(r=>series.map(s=>r[s.i])),1);
  const sx = i => P.l + i/(rows.length-1||1)*(W-P.l-P.r);
  const sy = v => H-P.b - v/max*(H-P.t-P.b);
  const grid = [0,.5,1].map(f=>`<line x1="${P.l}" y1="${sy(max*f)}" x2="${W-P.r}" y2="${sy(max*f)}" stroke="#EDF2F3"/>
    <text x="${P.l-6}" y="${sy(max*f)+3}" font-size="9" text-anchor="end">${nf(Math.round(max*f))}</text>`).join("");
  const paths = series.map(s=>{
    const d = rows.map((r,i)=>`${i?"L":"M"}${sx(i).toFixed(1)},${sy(r[s.i]).toFixed(1)}`).join("");
    return `<path d="${d}" fill="none" stroke="${s.c}" stroke-width="2" stroke-linejoin="round"/>` +
      rows.map((r,i)=>`<circle cx="${sx(i).toFixed(1)}" cy="${sy(r[s.i]).toFixed(1)}" r="2.2" fill="${s.c}"><title>${r[0]} ${s.n} ${nf(r[s.i])}</title></circle>`).join("");
  }).join("");
  const ticks = rows.map((r,i)=> (i%Math.ceil(rows.length/8)===0||i===rows.length-1)
    ? `<text x="${sx(i).toFixed(1)}" y="${H-8}" font-size="9" text-anchor="middle">${xs[i]}</text>`:"").join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%">${grid}${paths}${ticks}</svg>
    <div class="legend" style="border:0;padding:6px 0 0">${series.map(s=>`<span><i style="background:${s.c}"></i>${s.n}</span>`).join("")}</div>`;
}

/* ---------- 랭킹 표 ---------- */
function rankTable(rs, cols, sortKey){
  const br = quant(rs.map(sortKey));
  const sorted = rs.slice().sort((a,b)=>(sortKey(b)||0)-(sortKey(a)||0));
  return `<div class="tw"><table><thead><tr>
      <th class="l" style="width:34px"></th><th class="l">시군구</th>
      ${cols.map(c=>`<th>${c.t}</th>`).join("")}</tr></thead><tbody>
    ${sorted.map((r,i)=>{
      const q = qi(sortKey(r), br);
      return `<tr data-k="${r.sido}|${r.sgg}" class="${S.sgg===r.sido+"|"+r.sgg?"sel":""}">
        <td class="rk">${i+1}</td>
        <td class="l">${q<0?`<span class="sw" style="background:var(--line)"></span>`:`<span class="sw" style="background:${QC[q]}"></span>`}<b>${r.sgg}</b>
          <span style="color:var(--faint);font-size:11px;margin-left:5px">${r.sido.replace(/(특별시|광역시|특별자치시|특별자치도|도)$/,"")}</span></td>
        ${cols.map(c=>{const v=c.f(r); return `<td class="n${v===null||v===undefined?" dash":""}">${v===null||v===undefined?"—":(c.dec?nf2(v,c.dec):nf(v))}</td>`;}).join("")}
      </tr>`;}).join("")}
    </tbody></table></div>`;
}
function bindRows(root){
  root.querySelectorAll("tbody tr[data-k]").forEach(tr=>tr.onclick=()=>{
    S.sgg = S.sgg===tr.dataset.k ? null : tr.dataset.k; draw();
    const r = D.regions.find(x=>x.sido+"|"+x.sgg===S.sgg);
    if(r) flyTo(r);
  });
}

/* ---------- 지도 ---------- */
const MAPCAP = 12000;

/* 패널을 다시 그리면 지도 div가 새로 생기는데, Leaflet 인스턴스는 사라진 옛 div를
   붙잡고 있어 화면이 끊긴다. 컨테이너가 문서에서 떨어졌으면 인스턴스를 버리고 새로 만든다. */
function ensureMap(id){
  const node = document.getElementById(id);
  const cur = S.maps[id];
  if(cur){
    if(node && cur.node === node && node.isConnected){
      setTimeout(()=>cur.m.invalidateSize(), 30);
      return cur;
    }
    try{ cur.m.remove(); }catch(e){}
    delete S.maps[id];
  }
  if(!node || typeof L === "undefined") return null;

  const saved = S.view[id];
  const m = L.map(node, {preferCanvas:true, zoomControl:true})
             .setView(saved ? saved.c : [36.4,127.9], saved ? saved.z : 7);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {attribution:"© OpenStreetMap", maxZoom:18}).addTo(m);
  const renderer = L.canvas({padding:.3});
  const g = L.layerGroup().addTo(m);
  m.on("moveend", ()=>{ S.view[id] = {c:m.getCenter(), z:m.getZoom()}; });
  S.maps[id] = {m, g, node, renderer};
  setTimeout(()=>m.invalidateSize(), 60);
  return S.maps[id];
}

/* 마커마다 팝업 객체를 만들면 수천 개에서 눈에 띄게 느려진다.
   팝업 하나를 공유하고 클릭할 때 내용만 갈아 끼운다. */
function onPointClick(e){
  const d = e.target.__d, mm = S.maps[e.target.__mid];
  if(!mm) return;
  L.popup({closeButton:true}).setLatLng(e.latlng).setContent(d).openOn(mm.m);
}

function flyTo(r){
  const id = S.tab==="sum" ? "map-sum" : S.tab==="inf" ? "map-inf" : null; if(!id) return;
  const mm = S.maps[id]; if(!mm) return;
  const idx = D.regions.indexOf(r);
  let pts = D.vet.filter(p=>p[4]===idx);
  if(!pts.length) pts = D.pf.filter(p=>p[4]===idx);
  if(!pts.length) return;
  mm.m.fitBounds(L.latLngBounds(pts.map(p=>[p[0],p[1]])).pad(.15));
}

function paintMap(id){
  const mm = ensureMap(id);
  const noteEl = document.getElementById(id+"-note");
  if(!mm){
    if(noteEl) noteEl.innerHTML =
      `<b>지도 모듈을 불러오지 못했습니다.</b> Leaflet CDN 연결이 없는 환경입니다. 표·차트는 정상 동작합니다.`;
    return;
  }
  mm.g.clearLayers();

  // map-sum(분포 지도)에는 아직 업로드되지 않은 시도를 회색 원으로 먼저 깔아, 지도가
  // 항상 전국 범위로 보이면서 어떤 지역이 비어있는지 한눈에 드러나게 한다.
  if(id==="map-sum"){
    const active = new Set(Object.keys(RAW));
    ALL_SIDOS_28.forEach(name=>{
      if(active.has(name)) return; // 업로드된 지역은 아래에서 실제 데이터 점으로 표시되므로 회색 원은 생략
      const c = SIDO_CENTER_28[name]; if(!c) return;
      const label = name.replace(/(특별시|광역시|특별자치시|특별자치도)$/,"");
      L.circleMarker(c, {radius:9, weight:1, color:"#9aa4a9", fillColor:"#c7ccce", fillOpacity:.4, renderer:mm.renderer})
        .bindTooltip(`${label} · 미업로드`, {direction:"top"})
        .addTo(mm.g);
    });
  }

  const allow = new Set(regions().map(r=>D.regions.indexOf(r)));
  const bounds = [];
  let drawn = 0, total = 0, parts = [];

  const put = (p, color, radius, html) => {
    const mk = L.circleMarker([p[0],p[1]],
      {radius, weight:0, fillColor:color, fillOpacity:.6, renderer:mm.renderer});
    mk.__d = html; mk.__mid = id;
    mk.on("click", onPointClick);
    mk.addTo(mm.g);
    bounds.push([p[0],p[1]]);
    drawn++;
  };

  if(S.layers.has("vet")){
    const pts = D.vet.filter(p=>allow.has(p[4]));
    total += pts.length;
    const step = pts.length>MAPCAP ? Math.ceil(pts.length/MAPCAP) : 1;
    for(let i=0;i<pts.length;i+=step){
      const p = pts[i], rg = D.regions[p[4]];
      put(p, C("--brand-2"), 3.4,
        `<b>${p[2]}</b><br>동물병원 · ${rg?rg.sido+" "+rg.sgg:""}<br>인허가 ${p[3]}년`);
    }
    parts.push(`<span><i style="background:${C("--brand-2")}"></i>동물병원 ${nf(pts.length)}</span>`);
  }

  const pfSel = [...S.layers].filter(x=>x.indexOf("pf")===0);
  if(pfSel.length){
    const cat = pfSel[0]==="pf" ? null : pfSel[0].slice(3);
    let pts = D.pf.filter(p=>allow.has(p[4]));
    if(cat) pts = pts.filter(p=>D.pfCats[p[2]]===cat);
    total += pts.length;
    const step = pts.length>MAPCAP ? Math.ceil(pts.length/MAPCAP) : 1;
    for(let i=0;i<pts.length;i+=step){
      const p = pts[i], rg = D.regions[p[4]];
      put(p, C("--amber"), 2.6,
        `<b>${p[3]}</b><br>${D.pfCats[p[2]]} · ${rg?rg.sido+" "+rg.sgg:""}`);
    }
    parts.push(`<span><i style="background:${C("--amber")}"></i>${cat||"생활 인프라"} ${nf(pts.length)}</span>`);
  }

  // 등록현황·동반관광만 올라와 동물병원·생활인프라 좌표가 아직 없는 지역은 시도 중심에
  // 초록 마커라도 찍어, 활성화됐는데 지도에는 아무 표시도 없는 상황을 막는다.
  if(id==="map-sum"){
    const shownSidos = new Set();
    mm.g.eachLayer(l=>{});
    const pointSidos = new Set(
      D.vet.filter(p=>allow.has(p[4])).map(p=>D.regions[p[4]]?.sido).concat(
      D.pf.filter(p=>allow.has(p[4])).map(p=>D.regions[p[4]]?.sido))
    );
    Object.keys(RAW).forEach(name=>{
      if(pointSidos.has(name)) return;
      const c = SIDO_CENTER_28[name]; if(!c) return;
      const label = name.replace(/(특별시|광역시|특별자치시|특별자치도)$/,"");
      L.circleMarker(c, {radius:11, weight:2, color:"#1a7a4c", fillColor:"#3fb27f", fillOpacity:.85, renderer:mm.renderer})
        .bindTooltip(`${label} · 업로드됨 (등록현황/동반관광)`, {direction:"top"})
        .addTo(mm.g);
    });
  }

  const lg = document.getElementById(id+"-legend");
  if(lg) lg.innerHTML = parts.join("") || `<span style="color:var(--faint)">표시할 레이어가 없습니다</span>`;

  // 시도·시군구를 좁혔으면 그 범위로 맞춰준다. 전국일 때는 보던 위치를 유지한다.
  if((S.sido || S.sgg) && bounds.length && S.fit){
    mm.m.fitBounds(L.latLngBounds(bounds).pad(.12));
  }
  S.fit = false;

  if(noteEl) noteEl.innerHTML = drawn<total
    ? `표시 ${nf(drawn)} / 전체 ${nf(total)}건. <b>브라우저 렌더 한계로 균등 간격 추출해 표시합니다.</b> 시도나 카테고리를 좁히면 전량 표시됩니다. 통계·표 수치는 언제나 전량 기준입니다.`
    : `${nf(drawn)}건 전량 표시. 동물병원 좌표는 원본 EPSG:5174를 WGS84로 변환한 값이며, 좌표가 없는 원본 행은 지도에서 제외됩니다.`;
}

/* ---------- 전국 시도 중심좌표 (미업로드 지역을 회색 원으로 표시할 때 사용) ---------- */
const ALL_SIDOS_28 = ["서울특별시","부산광역시","대구광역시","인천광역시","광주광역시","대전광역시","울산광역시","세종특별자치시","경기도","강원특별자치도","충청북도","충청남도","전북특별자치도","전라남도","경상북도","경상남도","제주특별자치도"];
const SIDO_CENTER_28 = {
  "서울특별시":[37.5665,126.9780],"부산광역시":[35.1796,129.0756],"대구광역시":[35.8714,128.6014],
  "인천광역시":[37.4563,126.7052],"광주광역시":[35.1595,126.8526],"대전광역시":[36.3504,127.3845],
  "울산광역시":[35.5384,129.3114],"세종특별자치시":[36.4801,127.2890],"경기도":[37.4138,127.5183],
  "강원특별자치도":[37.8228,128.1555],"충청북도":[36.6357,127.4917],"충청남도":[36.5184,126.8000],

    ${kpi("반려 생활 인프라", pf, "개소", `동물약국·병원·미용·카페 등 <b>${D.pfCats.length}</b>종`)}

  </div>

    ${mapCard}
    <div class="card"><header><h3>시도별 등록 반려동물</h3><span class="meta">2022-12-31 기준<br>개 / 고양이 누적</span></header>

    <div class="card"><header><h3>시군구 종합 순위</h3>
      <span class="meta">행을 클릭하면 지도가 이동합니다</span></header>

  </div>`;
  bindRows($("#p-sum")); paintMap("map-sum");
}

  const catAgg = {};
  rs.forEach(r=>{ for(const k in r.pf) catAgg[k]=(catAgg[k]||0)+r.pf[k]; });
  const cats = Object.entries(catAgg).map(([k,v])=>({k,v})).sort((a,b)=>b.v-a.v);

  const orphan = rs.filter(r=>r.pet>=GAPMIN && r.vetOn===0);

  <div class="row r-2">

    <div class="card"><header><h3>공급 격차 하위 시군구</h3><span class="meta">등록 1천마리당 동물병원</span></header>

        <tbody>${gap.slice(0,25).map((r,i)=>`<tr data-k="${r.sido}|${r.sgg}"><td class="rk">${i+1}</td>
          <td class="l"><b>${r.sgg}</b> <span style="color:var(--faint);font-size:11px">${r.sido.replace(/(특별시|광역시|특별자치시|특별자치도|도)$/,"")}</span></td>
          <td class="n" style="color:var(--alert);font-weight:700">${nf2(r.vetPer1kPet)}</td>

        ${orphan.length?`<br><b>순위에서 뺀 ${orphan.length}곳:</b> ${orphan.map(r=>r.sgg+"("+nf(r.pet)+")").join(", ")} — 2022년엔 등록자료가 있었으나 현행 인허가에 영업 중 동물병원이 0곳입니다. 실제 공급 공백이 아니라 그 사이 행정구역이 통합·분리된 자리이므로 격차 지표로 쓸 수 없습니다.`:""}</div></div></div>

  bindRows($("#p-inf")); paintMap("map-inf");

function kpi(k,v,u,sub,segs){

    <div><span class="v">${typeof v==="number"&&v%1?nf2(v):nf(v)}</span><span class="u">${u}</span></div>
    <div class="sub">${sub}</div>${bar}</div></div>`;
}
function kpiAmber(k,v,u,sub){ return kpi(k,v,u,sub).replace('class="kpi"','class="kpi amber"'); }
function kpiInline(k,v,c,tot,unit){

}

/* ==================================================================
   CASE28_API — 데이터 업로드 반영 인터페이스
   업로드/파싱은 카탈로그(부모 페이지)가 담당하고, 이 iframe은
   "표준 통합 CSV"(데이터구분·시도·시군구·읍위경도 등 62개 컬럼) 행 배열을
   받아 지역별로 누적한 뒤 화면을 다시 그리는 API만 노출한다.
   원자료(RAW)를 지역별로 그대로 들고 있다가, 지역 추가/제거 때마다
   D.regions/D.vet/D.pf/D.gg/D.gw/D.ic 전체를 처음부터 다시 계산한다 —
   부분 패치 대신 항상 원자료에서 재구성해 인덱스 꼬임을 막는다.
   ================================================================== */
const RAW = {}; // RAW[시도] = { regRows, ggRows, vetRows, pfRows, gwRows, icRows }
function emptyRaw(){ return { regRows:[], ggRows:[], vetRows:[], pfRows:[], gwRows:[], icRows:[] }; }
function toN(v){ if(v==null) return null; const s=String(v).trim(); if(!s) return null; const n=Number(s.replace(/,/g,"")); return Number.isFinite(n)?n:null; }

/* ---------- EPSG:5174(Bessel 중부원점TM) -> WGS84 좌표 변환 ----------
   동물병원 원본(동물_동물병원.csv)의 좌표는 WGS84가 아니라 EPSG:5174이며,
   "위도" 컬럼에 북쪽거리(Y/Northing), "경도" 컬럼에 동쪽거리(X/Easting)가 들어있다
   (실제 값이 반대로 뒤바뀐 것이 아니라, 정부 원본 파일 자체가 이 순서로 배포된다).
   생활인프라 등 이미 WGS84인 데이터와 섞여 있으므로, 값의 범위(위도 절대값이 90을
   넘는지)로 EPSG:5174 여부를 판별해 필요한 행만 변환한다. */
function tm5174ToWgs84(x, y){
  const a = 6377397.155, f = 1/299.1528128, b = a*(1-f);
  const e2 = (a*a-b*b)/(a*a), ep2 = (a*a-b*b)/(b*b), k0 = 1.0;
  const lat0 = 38*Math.PI/180, lon0 = 127*Math.PI/180, FE = 200000, FN = 500000;
  const M0 = a*((1-e2/4-3*e2*e2/64-5*e2*e2*e2/256)*lat0
    -(3*e2/8+3*e2*e2/32+45*e2*e2*e2/1024)*Math.sin(2*lat0)
    +(15*e2*e2/256+45*e2*e2*e2/1024)*Math.sin(4*lat0)
    -(35*e2*e2*e2/3072)*Math.sin(6*lat0));
  const M = M0+(y-FN)/k0;
  const mu = M/(a*(1-e2/4-3*e2*e2/64-5*e2*e2*e2/256));
  const e1 = (1-Math.sqrt(1-e2))/(1+Math.sqrt(1-e2));
  const J1 = 3*e1/2-27*Math.pow(e1,3)/32, J2 = 21*e1*e1/16-55*Math.pow(e1,4)/32;
  const J3 = 151*Math.pow(e1,3)/96, J4 = 1097*Math.pow(e1,4)/512;
  const fp = mu+J1*Math.sin(2*mu)+J2*Math.sin(4*mu)+J3*Math.sin(6*mu)+J4*Math.sin(8*mu);
  const C1 = ep2*Math.pow(Math.cos(fp),2), T1 = Math.pow(Math.tan(fp),2);
  const R1 = a*(1-e2)/Math.pow(1-e2*Math.pow(Math.sin(fp),2),1.5);
  const N1 = a/Math.sqrt(1-e2*Math.pow(Math.sin(fp),2));
  const D = (x-FE)/(N1*k0);
  const Q1 = N1*Math.tan(fp)/R1, Q2 = D*D/2;
  const Q3 = (5+3*T1+10*C1-4*C1*C1-9*ep2)*Math.pow(D,4)/24;
  const Q4 = (61+90*T1+298*C1+45*T1*T1-3*C1*C1-252*ep2)*Math.pow(D,6)/720;
  const lat = fp-Q1*(Q2-Q3+Q4);
  const Q6 = (1+2*T1+C1)*Math.pow(D,3)/6;
  const Q7 = (5-2*C1+28*T1-3*C1*C1+8*ep2+24*T1*T1)*Math.pow(D,5)/120;
  const lon = lon0+(D-Q6+Q7)/Math.cos(fp);
  // Bessel(옛 한국측지계) -> WGS84 몰로덴스키 근사 변환
  const dx=-146.43, dy=507.89, dz=681.46;
  const da = 6378137-a, df = (1/298.257223563)-f;
  const sinLat=Math.sin(lat), cosLat=Math.cos(lat), sinLon=Math.sin(lon), cosLon=Math.cos(lon);
  const rho = a*(1-e2)/Math.pow(1-e2*sinLat*sinLat,1.5);
  const nu = a/Math.sqrt(1-e2*sinLat*sinLat);
  const dLat = (-dx*sinLat*cosLon-dy*sinLat*sinLon+dz*cosLat
    +da*(nu*e2*sinLat*cosLat)/a+df*(rho*(a/b)+nu*(b/a))*sinLat*cosLat)/rho;
  const dLon = (-dx*sinLon+dy*cosLon)/(nu*cosLat);
  return [lat*180/Math.PI+dLat*180/Math.PI, lon*180/Math.PI+dLon*180/Math.PI];
}
function normalizeLatLng(rawLat, rawLng){
  if(rawLat==null || rawLng==null) return [null, null];
  if(Math.abs(rawLat) > 90 || Math.abs(rawLng) > 180){
    // 좌표 절대값이 실제 위경도 범위를 벗어나면 EPSG:5174로 보고 변환한다.
    // 원본 컬럼은 "위도"=북쪽거리(Y), "경도"=동쪽거리(X) 순서로 들어있다.
    try { return tm5174ToWgs84(rawLng, rawLat); } catch(e){ return [null, null]; }
  }
  return [rawLat, rawLng];
}

function rebuildFromRaw(){
  D.regions = []; D.vet = []; D.pf = []; D.gg = []; D.gw = []; D.ic = []; D.vetYears = [];
  const regionMap = new Map();
  const getRegion = (sido, sgg) => {
    const key = sido+"|"+(sgg||"(전체)");
    if(!regionMap.has(key)){
      const obj = {sido, sgg: sgg||"(전체)", dog:0, cat:0, pet:0, vetOn:0, vetOff:0, pf:{}};
      regionMap.set(key, {obj, idx: D.regions.length});
      D.regions.push(obj);
    }
    return regionMap.get(key);
  };
  const yearMap = {};

  Object.keys(RAW).forEach(sido=>{
    const raw = RAW[sido];
    raw.regRows.forEach(row=>{
      const {obj} = getRegion(sido, row.sgg);
      obj.dog += row.dog||0; obj.cat += row.cat||0; obj.pet += (row.dog||0)+(row.cat||0);
    });
    raw.vetRows.forEach(row=>{
      const {obj, idx} = getRegion(sido, row.sgg);
      if(row.status && row.status.indexOf("영업")>=0) obj.vetOn++; else obj.vetOff++;
      if(row.lat!=null && row.lng!=null) D.vet.push([row.lat, row.lng, row.name||"", row.year||"", idx]);
      if(row.year){ const e = yearMap[row.year] = yearMap[row.year]||{n:0,c:0}; e.n++; }
      if(row.closedYear){ const e = yearMap[row.closedYear] = yearMap[row.closedYear]||{n:0,c:0}; e.c++; }
    });
    raw.pfRows.forEach(row=>{
      const {obj, idx} = getRegion(sido, row.sgg);
      const cat = row.cat || "기타";
      obj.pf[cat] = (obj.pf[cat]||0)+1;
      let ci = D.pfCats.indexOf(cat);
      if(ci===-1){ D.pfCats.push(cat); ci = D.pfCats.length-1; }
      if(row.lat!=null && row.lng!=null) D.pf.push([row.lat, row.lng, ci, row.name||"", idx]);
    });
    raw.ggRows.forEach(row=>{ D.gg.push(row); });
    raw.gwRows.forEach(row=>{ D.gw.push(row); });
    raw.icRows.forEach(row=>{ D.ic.push(row); });
  });

  D.regions.forEach(r=>{
    r.pfTot = Object.values(r.pf).reduce((a,b)=>a+b,0);
    r.vetPer1kPet = r.pet ? r.vetOn/r.pet*1000 : null;
  });
  D.vetYears = Object.keys(yearMap).sort().map(y=>[y, yearMap[y].n, yearMap[y].c]);
  const uniqSgg = new Set(D.gg.map(g=>g[1]));
  D.ggCov = D.gg.length ? [{y:S.ggYear, sgg:uniqSgg.size, emd:D.gg.length, n:D.gg.length}] : [];

  T.dog = sum(D.regions,r=>r.dog); T.cat = sum(D.regions,r=>r.cat); T.pet = sum(D.regions,r=>r.pet);
  T.vetOn = sum(D.regions,r=>r.vetOn); T.vetAll = sum(D.regions,r=>r.vetOn+r.vetOff);
  T.pf = sum(D.regions,r=>r.pfTot);
  T.gwN = D.gw.length; T.icN = D.ic.length; T.ggN = D.gg.length;
  T.ggSgg = uniqSgg.size; T.ggEmd = D.gg.length;

  SIDOS = [...new Set(D.regions.map(r=>r.sido))].sort();
}

window.CASE28_API = {
  getActiveRegions: () => Object.keys(RAW),
  ingestAndActivate(rows, fileName){
    if(!rows || rows.length<2) return {ok:false, reason:"파일에 데이터 행이 없습니다."};
    const header = rows[0].map(v=>String(v||"").trim());
    const idx = {}; header.forEach((h,i)=>{ if(idx[h]===undefined) idx[h]=i; });
    if(idx["데이터구분"]===undefined || idx["시도"]===undefined){
      return {ok:false, reason:'표준 양식과 일치하지 않습니다 — "데이터구분", "시도" 컬럼을 찾을 수 없습니다. 표준 양식을 다시 내려받아 값만 채워 업로드해 주세요.'};
    }
    const body = rows.slice(1).filter(r=>r && r.some(v=>String(v||"").trim()!==""));
    if(!body.length) return {ok:false, reason:"파일에서 유효한 데이터 행을 찾지 못했습니다."};

    let lastSido = null, count = 0;
    body.forEach(r=>{
      const get = k => idx[k]!==undefined ? r[idx[k]] : undefined;
      const gu = String(get("데이터구분")||"").trim();
      const sido = String(get("시도")||"").trim();
      if(!sido) return;
      lastSido = sido; count++;
      if(!RAW[sido]) RAW[sido] = emptyRaw();
      const raw = RAW[sido];
      const sgg = String(get("시군구")||"").trim();
      const [lat, lng] = normalizeLatLng(toN(get("위도")), toN(get("경도")));

      if(gu==="등록현황"){
        const dog = toN(get("개등록누계")), cat = toN(get("고양이등록누계"));
        if(dog!==null || cat!==null) raw.regRows.push({sgg, dog: dog||0, cat: cat||0});
        const emd = String(get("읍면동")||"").trim();
        if(emd){
          const yy = String(get("데이터기준일")||"").slice(0,4) || String(get("기준연도")||"");
          raw.ggRows.push([yy, sgg, emd,
            toN(get("등록동물수_마리"))||0, toN(get("RFID내장치형수"))||0,
            toN(get("RFID외장치형수"))||0, toN(get("RFID인지형수"))||0,
            toN(get("동물소유자수"))||0, toN(get("동물품종수"))||0]);
        }
      } else if(gu==="동물병원"){
        raw.vetRows.push({
          sgg, name: get("명칭"), year: String(get("인허가일자")||"").slice(0,4),
          closedYear: String(get("폐업일자")||"").slice(0,4) || null,
          status: get("영업상태명"), lat, lng
        });
      } else if(gu==="생활인프라"){
        raw.pfRows.push({ sgg, name: get("명칭"), cat: get("대분류")||"기타", lat, lng });
      } else if(gu==="동반관광"){
        if(sido.indexOf("강원")>=0){
          raw.gwRows.push([lat, lng, get("명칭"), get("대분류"), get("지역명_원자료")||sgg]);
        } else {
          raw.icRows.push({
            sgg: get("지역명_원자료")||sgg, cat: get("대분류"), sub: get("중분류"),
            name: get("명칭"), addr: get("지번주소"),
            space: get("실내가능여부")==="Y" ? "실내" : (get("실외가능여부")==="Y" ? "실외" : ""),
            limit: get("반려동물제한사항"), fee: get("이용료"), hour: get("이용시간"),
            note: get("기타특이사항")
          });
        }
      }
    });

    if(!count) return {ok:false, reason:"인식 가능한 데이터 행이 없습니다."};
    rebuildFromRaw();
    renderTabs();
    draw();
    return {ok:true, region:lastSido, rowCount:count};
  },
  removeRegion(sido){
    if(!RAW[sido]) return {ok:false, reason:"해당 시도의 업로드 자료가 없습니다."};
    delete RAW[sido];
    rebuildFromRaw();
    renderTabs();
    draw();
    return {ok:true};
  },
  reset(){
    Object.keys(RAW).forEach(k=>delete RAW[k]);
    rebuildFromRaw();
    renderTabs();
    draw();
  }
};
