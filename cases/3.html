<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>고용·소득 대시보드</title>
<style>
:root{--ink:#10232b;--muted:#68777e;--line:#dce5e8;--blue:#2F5FE0;--green:#16A085;--orange:#F0994D;--red:#D8384B}
*{box-sizing:border-box}body{margin:0;color:var(--ink);background:#f6f9fa;font-family:Pretendard,"Malgun Gothic",Arial,sans-serif}
button,select{font:inherit;color:inherit}button{cursor:pointer}
.header{height:76px;display:flex;align-items:center;gap:18px;padding:0 28px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:13px 13px 13px 4px;background:linear-gradient(145deg,#2F5FE0,#16A085);color:#fff;font-weight:900;font-size:22px;display:grid;place-items:center}
.brand b{font-size:17px;display:block;line-height:1.15}.brand small{font-size:11px;color:var(--muted);letter-spacing:.06em}
.pickers{display:flex;align-items:center;gap:10px;margin-left:auto}
.pickers label{font-size:13px;color:var(--muted);font-weight:700}
.pickers select{padding:9px 13px;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:800;min-width:150px}
.wrap{display:grid;grid-template-columns:236px 1fr;min-height:calc(100vh - 76px)}
.side{background:#fff;border-right:1px solid var(--line);padding:20px 14px}
.side h4{margin:0 0 12px;font-size:12px;color:var(--muted);letter-spacing:.05em}
.side button{display:block;width:100%;text-align:left;border:0;background:none;padding:11px 12px;border-radius:9px;font-size:13.5px;line-height:1.4;color:#3d4a51;margin-bottom:3px}
.side button:hover{background:#f2f7f9}.side button.on{background:#eaf1fd;color:var(--blue);font-weight:800}
.side button.off{color:#b4bec4}
.main{padding:26px 30px 60px;max-width:1560px}
.ttl{display:flex;align-items:center;gap:11px;margin:0 0 6px;font-size:23px;flex-wrap:wrap}
.badge{padding:3px 11px;border-radius:999px;background:#eaf1fd;color:var(--blue);font-size:12px;font-weight:800}
.badge.warn{background:#fdecec;color:#c0392b}.badge.info{background:#fff6e5;color:#a86a12}
.meta{color:var(--muted);font-size:12.5px;margin:0 0 20px;line-height:1.7}
.grid{display:grid;gap:18px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.card h3{margin:0 0 4px;font-size:14.5px}.card .sub{margin:0 0 12px;font-size:11.5px;color:var(--muted)}
.card svg{display:block}
.kpi{font-size:26px;font-weight:900;letter-spacing:-.02em}.kpi small{font-size:12px;font-weight:700;color:var(--muted);margin-left:5px}
.chg{font-size:12px;font-weight:800;margin-top:3px}.chg.up{color:#0f8a5f}.chg.dn{color:var(--red)}.chg.n{color:var(--muted)}
.na{display:grid;place-items:center;min-height:250px;border:1px dashed #d6dfe3;border-radius:12px;background:#fbfcfd;text-align:center;padding:26px}
.na b{display:block;font-size:15px;color:#8a949a;margin:8px 0}.na span{font-size:12.5px;color:#a3adb3;line-height:1.7;max-width:560px;display:block}
.na-tag{display:inline-block;padding:3px 11px;border-radius:999px;background:#fdecec;color:#c0392b;font-size:11.5px;font-weight:800}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:8px 9px;border-bottom:1px solid #eef2f4;text-align:right}
th:first-child,td:first-child{text-align:left}th{color:var(--muted);font-weight:700;background:#fafcfd}
tbody tr:hover{background:#f7fbfd}tbody tr.hi{background:#eaf1fd}
.foot{margin-top:26px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:11.5px;line-height:1.8}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:11.5px;color:var(--muted)}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}
.notice{background:#fff6e5;border:1px solid #f3dfb5;color:#8a6414;border-radius:10px;padding:11px 14px;font-size:12.5px;margin-bottom:18px;line-height:1.7}
</style></head><body>

  const step=Math.ceil(labels.length/10);
  const xa=labels.map((l,i)=>(i%step===0||i===labels.length-1)?`<text x="${x(i)}" y="${h-pB+21}" text-anchor="middle" font-size="10.5" fill="#68777e">${esc(l)}</text>`:'').join('');
  const lg=ss.map((s,i)=>`<span><i style="background:${s.color||PAL[i%PAL.length]}"></i>${esc(s.name)}</span>`).join('');
  return `<svg viewBox="0 0 ${W} ${h}" width="100%">${gr}<line x1="${pL}" x2="${W-pR}" y1="${h-pB}" y2="${h-pB}" stroke="#aab4ba"/>${bd}${xa}</svg><div class="legend">${lg}</div>`;
}
function barSVG(labels,ss,unit,opt={}){
  const h=opt.h||300,n=labels.length,W=Math.max(620,n*(opt.wide?66:46)),pL=58,pR=16,pT=26,pB=opt.rotate?92:40;
  const all=ss.flatMap(s=>nn(s.data));if(!all.length)return naBox('표시할 값이 없습니다.');
  let hi=Math.max(...all,0),lo=Math.min(...all,0);const g=(hi-lo)*0.16||1;hi+=g;if(lo<0)lo-=g;
  const y=v=>pT+(hi-v)*(h-pT-pB)/(hi-lo);
  const grp=(W-pL-pR)/n,bw=Math.min(30,grp*0.66/ss.length);
  let gr='';for(let i=0;i<5;i++){const v=lo+(hi-lo)*i/4;gr+=`<line x1="${pL}" x2="${W-pR}" y1="${y(v)}" y2="${y(v)}" stroke="#eef2f4"/><text x="${pL-9}" y="${y(v)+4}" text-anchor="end" font-size="10.5" fill="#8b969c">${fmt(v,opt.decimals||0)}</text>`}
  let bd='';
  labels.forEach((l,i)=>{const cx=pL+grp*i+grp/2;
    ss.forEach((s,si)=>{const v=s.data[i];if(v===null||v===undefined)return;
      const bx=cx-(ss.length*bw)/2+si*bw,c=(opt.colorFn?opt.colorFn(l,i,si):(s.color||PAL[si%PAL.length]));
      const top=Math.min(y(v),y(0)),hh=Math.abs(y(v)-y(0));
      bd+=`<rect x="${bx}" y="${top}" width="${bw*0.86}" height="${Math.max(1,hh)}" rx="3" fill="${c}"><title>${esc(l)} · ${esc(s.name)}: ${fmt(v,opt.decimals||0)}${unit||''}</title></rect>`;
      if(ss.length<=2)bd+=`<text x="${bx+bw*0.43}" y="${v>=0?y(v)-6:y(v)+14}" text-anchor="middle" font-size="10" font-weight="700" fill="#3d4a51">${fmt(v,opt.decimals||0)}</text>`});
    bd+=opt.rotate?`<text x="${cx}" y="${h-pB+16}" text-anchor="end" font-size="10.5" fill="#68777e" transform="rotate(-42 ${cx} ${h-pB+16})">${esc(l)}</text>`
                  :`<text x="${cx}" y="${h-pB+20}" text-anchor="middle" font-size="10.5" fill="#68777e">${esc(l)}</text>`});
  const lg=ss.length>1?`<div class="legend">${ss.map((s,i)=>`<span><i style="background:${s.color||PAL[i%PAL.length]}"></i>${esc(s.name)}</span>`).join('')}</div>`:'';
  return `<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${h}" width="${W}" style="max-width:none">${gr}<line x1="${pL}" x2="${W-pR}" y1="${y(0)}" y2="${y(0)}" stroke="#aab4ba"/>${bd}</svg></div>${lg}`;
}

  <div class="card" style="margin-bottom:18px"><h3>${label} 종사상지위별 추이</h3><p class="sub">반기 · 단위 천명</p>
    ${lineSVG(PERIODS,cur,'천명',280)}</div>
  <div class="card"><h3>${SHORT[REGION]} 시군구별 종사상지위 구성</h3><p class="sub">${PERIODS[i]} · 상용근로자 내림차순 · 단위 천명</p>
    ${barSVG(rows.map(r=>r.g),[{name:'상용근로자',data:rows.map(r=>r.a),color:'#2F5FE0'},
      {name:'임시·일용근로자',data:rows.map(r=>r.b),color:'#F0994D'},
      {name:'비임금근로자',data:rows.map(r=>r.c),color:'#16A085'}],'천명',{rotate:true,decimals:1,h:340,wide:true})}</div>`;
}
function renderIncome(){
  return head(`${SHORT[REGION]} 월 평균 추정소득`,'비활성','자치구 지도 · 소득구간별 인구 · 연령·성별 소득 피라미드','warn')+
  `<div class="card">${naBox('월 평균 추정소득은 신용정보사가 카드·금융 데이터를 기반으로 산출하는 민간 추정통계입니다. 공공데이터로는 제공되지 않아 소득구간별 인구 분포와 연령·성별 소득 피라미드를 구성할 수 없습니다. 대체안으로 국세통계(연 단위 근로소득 신고 기준)를 검토할 수 있으나, 원본 화면의 월별 추이·자치구 단위 구조와는 맞지 않습니다.')}</div>`;
}
const VIEWS=[
 {id:'overview',label:'고용 개요',ok:1,fn:renderOverview},
 {id:'wage',label:'임금 및 근로시간',ok:1,fn:renderWage},
 {id:'insured',label:'고용보험 피보험자 현황',ok:1,fn:renderInsured},
 {id:'region',label:'시군구별 고용지표',ok:1,fn:renderRegion},
 {id:'occup',label:'직업별 취업자',ok:1,fn:renderOccup},
 {id:'status',label:'종사상지위별 취업자',ok:1,fn:renderStatus},
 {id:'income',label:'월 평균 추정소득',ok:0,fn:renderIncome},
];
function buildNav(){
  $('#nav').innerHTML=VIEWS.map(v=>`<button data-v="${v.id}" class="${v.id===VIEW?'on':''} ${v.ok?'':'off'}">${esc(v.label)}${v.ok?'':' ✕'}</button>`).join('');
  $('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{VIEW=b.dataset.v;render()});
}
function buildGuSel(){
  const ks=gus(REGION);
  $('#guSel').innerHTML=`<option value="">${SHORT[REGION]} 전체</option>`+ks.map(g=>`<option value="${esc(g)}">${esc(g)}</option>`).join('');
  $('#guSel').value=GU&&ks.includes(GU)?GU:'';
  $('#guSel').disabled=!ks.length;
}
function render(){
  buildNav();buildGuSel();
  const v=VIEWS.find(x=>x.id===VIEW);
  $('#main').innerHTML=v.fn()+
  `<p class="foot">본 화면은 공공데이터 실측값으로 구성되었습니다. (수집 2026-08-24)<br>
   지역별고용조사 ${PERIODS[0]}~${PERIODS[PERIODS.length-1]} (직업별 ${OCP[0]}~${OCP[OCP.length-1]}) · 고용행정통계 ${INSM[0]}~${INSM[INSM.length-1]} · 사업체노동력조사 ${WY[WY.length-1]}년<br>
   16개 시도 · 227개 시군구 전환 지원 · 2026년 7월 1일 전남광주통합특별시 출범 반영<br>
   ✕ 표시 항목은 전국 표준 공공데이터가 없어 비활성 처리되었습니다.</p>`;
  window.scrollTo(0,0);
}
$('#regionSel').innerHTML=SIDO.map(s=>`<option value="${s}">${s}</option>`).join('');
$('#regionSel').value=REGION;
$('#regionSel').onchange=e=>{REGION=e.target.value;GU=null;document.title=`${REGION} · 고용·소득`;render()};
$('#guSel').onchange=e=>{GU=e.target.value||null;render()};
render();
</script></body></html>
