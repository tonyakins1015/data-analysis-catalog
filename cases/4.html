<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>산업 대시보드</title>
<style>
:root{--ink:#10232b;--muted:#68777e;--line:#dce5e8;--green:#1BA97E;--blue:#2F5FE0;--orange:#F0994D;--red:#D8384B}
*{box-sizing:border-box}body{margin:0;color:var(--ink);background:#f6f9fa;font-family:Pretendard,"Malgun Gothic",Arial,sans-serif}
button,select{font:inherit;color:inherit}button{cursor:pointer}
.header{height:76px;display:flex;align-items:center;gap:18px;padding:0 28px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:13px 13px 13px 4px;background:linear-gradient(145deg,#1BA97E,#2F5FE0);color:#fff;font-weight:900;font-size:22px;display:grid;place-items:center}
.brand b{font-size:17px;display:block;line-height:1.15}.brand small{font-size:11px;color:var(--muted);letter-spacing:.06em}
.pickers{display:flex;align-items:center;gap:10px;margin-left:auto}
.pickers label{font-size:13px;color:var(--muted);font-weight:700}
.pickers select{padding:9px 13px;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:800;min-width:140px}
.wrap{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 76px)}
.side{background:#fff;border-right:1px solid var(--line);padding:20px 14px}
.side h4{margin:0 0 12px;font-size:12px;color:var(--muted);letter-spacing:.05em}
.side button{display:block;width:100%;text-align:left;border:0;background:none;padding:11px 12px;border-radius:9px;font-size:13.5px;line-height:1.4;color:#3d4a51;margin-bottom:3px}
.side button:hover{background:#f2f7f9}.side button.on{background:#e7f6f1;color:#0d7d5c;font-weight:800}
.main{padding:26px 30px 60px;max-width:1560px}
.ttl{display:flex;align-items:center;gap:11px;margin:0 0 6px;font-size:23px;flex-wrap:wrap}
.badge{padding:3px 11px;border-radius:999px;background:#e7f6f1;color:#0d7d5c;font-size:12px;font-weight:800}
.badge.g{background:#eef1f2;color:#7b868c}
.meta{color:var(--muted);font-size:12.5px;margin:0 0 20px;line-height:1.7}
.grid{display:grid;gap:18px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.card h3{margin:0 0 4px;font-size:14.5px}.card .sub{margin:0 0 12px;font-size:11.5px;color:var(--muted)}
.card svg{display:block}
.kpi{font-size:25px;font-weight:900;letter-spacing:-.02em}.kpi small{font-size:12px;font-weight:700;color:var(--muted);margin-left:5px}
.chg{font-size:12px;font-weight:800;margin-top:4px}.chg.up{color:#0f8a5f}.chg.dn{color:var(--red)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:8px 9px;border-bottom:1px solid #eef2f4;text-align:right}
th:first-child,td:first-child{text-align:left}th{color:var(--muted);font-weight:700;background:#fafcfd}
tbody tr:hover{background:#f7fbfd}tbody tr.hi{background:#e7f6f1}
.foot{margin-top:26px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:11.5px;line-height:1.8}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:11.5px;color:var(--muted)}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}
.notice{background:#eef7ff;border:1px solid #cfe4f7;color:#245b86;border-radius:10px;padding:11px 14px;font-size:12.5px;margin-bottom:18px;line-height:1.7}
</style></head><body>
<div class="header">
  <div class="brand"><div class="logo">G</div><div><b>공공데이터 허브</b><small>PUBLIC DATA HUB</small></div></div>
  <div class="pickers">
    <label for="yearSel">연도</label><select id="yearSel"></select>
    <label for="regionSel">지역</label><select id="regionSel"></select>
    <label for="guSel">시군구</label><select id="guSel"></select>
  </div>
</div>
<div class="wrap">
  <nav class="side"><h4>산업</h4><div id="nav"></div></nav>
  <main class="main" id="main"></main>
</div>

function hbarSVG(items,unit,opt={}){
  const n=items.length,rowH=opt.rowH||19,gap=8,pL=opt.pL||230,pR=86,pT=8,W=760,H=pT+n*(rowH+gap);
  const mx=Math.max(...items.map(i=>i.value||0),1);
  let bd='';
  items.forEach((it,i)=>{const yy=pT+i*(rowH+gap),w=(W-pL-pR)*(it.value||0)/mx;
    bd+=`<text x="${pL-10}" y="${yy+rowH-4}" text-anchor="end" font-size="11.5" fill="#3d4a51">${esc(it.name.length>22?it.name.slice(0,21)+'…':it.name)}</text>`;
    bd+=`<rect x="${pL}" y="${yy}" width="${Math.max(1,w)}" height="${rowH}" rx="4" fill="${it.color||PAL[i%PAL.length]}"><title>${esc(it.name)}: ${fmt(it.value,opt.decimals||0)}${unit||''}</title></rect>`;
    bd+=`<text x="${pL+w+8}" y="${yy+rowH-4}" font-size="11.5" font-weight="700" fill="#3d4a51">${fmt(it.value,opt.decimals||0)}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" width="100%">${bd}</svg>`;
}
function donut(items,unit){
  const tot=items.reduce((a,b)=>a+(b.value||0),0)||1,S=210,cx=S/2,cy=S/2,r=78,ir=48;
  let a0=-Math.PI/2,bd='';
  items.forEach((it,i)=>{const frac=(it.value||0)/tot,a1=a0+frac*Math.PI*2;
    const lg=frac>0.5?1:0,c=PAL[i%PAL.length];
    const x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
    const xi1=cx+ir*Math.cos(a1),yi1=cy+ir*Math.sin(a1),xi0=cx+ir*Math.cos(a0),yi0=cy+ir*Math.sin(a0);
    bd+=`<path d="M${x0},${y0} A${r},${r} 0 ${lg},1 ${x1},${y1} L${xi1},${yi1} A${ir},${ir} 0 ${lg},0 ${xi0},${yi0} Z" fill="${c}"><title>${esc(it.name)}: ${fmt(it.value)}${unit||''} (${(frac*100).toFixed(1)}%)</title></path>`;
    a0=a1});
  const lg=items.map((it,i)=>`<span><i style="background:${PAL[i%PAL.length]}"></i>${esc(it.name)} ${((it.value||0)/tot*100).toFixed(1)}%</span>`).join('');
  return `<svg viewBox="0 0 ${S} ${S}" width="210" style="margin:0 auto">${bd}<text x="${cx}" y="${cy-2}" text-anchor="middle" font-size="13" font-weight="900">${fmt(tot)}</text><text x="${cx}" y="${cy+14}" text-anchor="middle" font-size="10" fill="#8b969c">개</text></svg><div class="legend" style="justify-content:center">${lg}</div>`;
}
function head(t,scope,note,cls){return `<h2 class="ttl">${esc(t)}<span class="badge ${cls||''}">${esc(scope)}</span></h2><p class="meta">${note}</p>`}
function scopeData(){
  const r=R();
  if(GU&&r.gu[YEAR]&&r.gu[YEAR][GU]){
    const g=r.gu[YEAR][GU];
    return{name:GU,ind:Object.fromEntries(INDS.map(i=>[i,g[i]||[0,0]])),scoped:true};
  }
  return{name:SHORT[REGION]+' 전체',ind:r.ind[YEAR],scoped:false};
}
function totals(ind){return INDS.reduce((a,i)=>[a[0]+(ind[i]?ind[i][0]:0),a[1]+(ind[i]?ind[i][1]:0)],[0,0])}

function renderOverview(){
  const s=scopeData(),[b,e]=totals(s.ind);
  const py=YEARS[YEARS.indexOf(YEAR)-1];
  let pb=null,pe=null;
  if(py){const ps=GU&&R().gu[py]&&R().gu[py][GU]?Object.fromEntries(INDS.map(i=>[i,R().gu[py][GU][i]||[0,0]])):R().ind[py];[pb,pe]=totals(ps)}
  const es=R().empsex[YEAR],fem=R().sex[YEAR]['여성'][0];
  const rank=SIDO.map(x=>({x,v:totals(DB.regions[x].ind[YEAR])[0]})).sort((a,b2)=>b2.v-a.v);
  const top=INDS.map(i=>({name:i,value:s.ind[i]?s.ind[i][0]:0})).sort((a,b2)=>b2.value-a.value).slice(0,10);
  const d=(c,p)=>p?`<div class="chg ${c>=p?'up':'dn'}">${c>=p?'▲':'▼'} 전년대비 ${fmt(Math.abs(c-p))}개 (${((c/p-1)*100).toFixed(2)}%)</div>`:'';
  return head(`${s.name} 산업 개요`,GU?`${REGION} · ${GU}`:REGION,`${YEAR}년 기준 · 출처 국가데이터처 전국사업체조사 원자료 집계`)+
  `<div class="grid g4" style="margin-bottom:18px">
    <div class="card"><h3>사업체 수</h3><p class="sub">${YEAR}년</p><div class="kpi">${fmt(b)}<small>개</small></div>${d(b,pb)}</div>
    <div class="card"><h3>종사자 수</h3><p class="sub">${YEAR}년</p><div class="kpi">${fmt(e)}<small>명</small></div>${d(e,pe)}</div>
    <div class="card"><h3>사업체당 종사자</h3><p class="sub">${YEAR}년</p><div class="kpi">${(e/b).toFixed(1)}<small>명</small></div></div>
    <div class="card"><h3>여성 대표 사업체</h3><p class="sub">${YEAR}년 · ${SHORT[REGION]} 기준</p><div class="kpi">${fmt(fem)}<small>개</small></div><div class="chg">비중 ${(fem/totals(R().ind[YEAR])[0]*100).toFixed(1)}%</div></div>
  </div>
  <div class="grid g2">
    <div class="card"><h3>${s.name} 산업대분류별 사업체 수 상위 10</h3><p class="sub">${YEAR}년 · 단위 개</p>${hbarSVG(top,'개')}</div>
    <div class="card"><h3>시도별 사업체 수 비교</h3><p class="sub">${YEAR}년 · 단위 개</p>
      ${barSVG(rank.map(x=>SHORT[x.x]),[{name:'사업체수',data:rank.map(x=>x.v)}],'개',{rotate:true,h:320,colorFn:l=>l===SHORT[REGION]?'#D8384B':'#1BA97E'})}</div>
  </div>`;
}
function renderIndType(){
  const s=scopeData();
  const rows=INDS.map(i=>({name:i,b:s.ind[i]?s.ind[i][0]:0,e:s.ind[i]?s.ind[i][1]:0})).sort((a,b2)=>b2.b-a.b);
  const gl=gus();
  const guRank=gl.map(g=>({g,v:INDS.reduce((a,i)=>a+((R().gu[YEAR][g][i]||[0,0])[0]),0)})).sort((a,b2)=>b2.v-a.v);
  return head(`${s.name} 산업별 사업체 및 종사자 수`,GU?`${REGION} · ${GU}`:REGION,`${YEAR}년 · 산업대분류 ${INDS.length}개 · 출처 국가데이터처 전국사업체조사 원자료 집계`)+
  `<div class="card" style="margin-bottom:18px"><h3>${s.name} 산업대분류별 사업체 · 종사자</h3><p class="sub">${YEAR}년 · 사업체 수 내림차순</p>
    ${barSVG(rows.map(r=>r.name),[{name:'사업체수',data:rows.map(r=>r.b),color:'#1BA97E'},{name:'종사자수',data:rows.map(r=>r.e),color:'#2F5FE0'}],'',{rotate:true,h:360,wide:true})}</div>
  ${gl.length?`<div class="card" style="margin-bottom:18px"><h3>${SHORT[REGION]} 시군구별 사업체 수</h3><p class="sub">${YEAR}년 · ${gl.length}개 시군구 · 단위 개</p>
    ${barSVG(guRank.map(r=>r.g),[{name:'사업체수',data:guRank.map(r=>r.v)}],'개',{rotate:true,h:340,wide:true,colorFn:l=>l===GU?'#D8384B':'#1BA97E'})}</div>`:''}
  <div class="card"><h3>${s.name} 산업대분류별 상세</h3><p class="sub">${YEAR}년</p>
    <table><thead><tr><th>산업대분류</th><th>사업체 수</th><th>구성비</th><th>종사자 수</th><th>구성비</th><th>사업체당 종사자</th></tr></thead><tbody>
    ${(()=>{const tb=rows.reduce((a,r)=>a+r.b,0),te=rows.reduce((a,r)=>a+r.e,0);
      return rows.map(r=>`<tr><td><b>${esc(r.name)}</b></td><td>${fmt(r.b)}</td><td>${(r.b/tb*100).toFixed(1)}%</td><td>${fmt(r.e)}</td><td>${(r.e/te*100).toFixed(1)}%</td><td>${r.b?(r.e/r.b).toFixed(1):'—'}</td></tr>`).join('')})()}
    </tbody></table></div>`;
}
function renderCharType(){
  const org=ORGS.map(o=>({name:o,value:R().org[YEAR][o]||0})).filter(x=>x.value>0);
  const size=SIZES.map(s=>({name:s,value:R().size[YEAR][s]||0}));
  const es=R().empsex[YEAR];
  return head(`${SHORT[REGION]} 특성별 사업체 및 종사자 수`,REGION,`${YEAR}년 · 출처 국가데이터처 전국사업체조사 원자료 집계`)+
  `<div class="notice">조직형태·종사자규모·대표자 성별은 <b>시도 단위</b>로 집계했습니다. 원자료에 대표자 연령 항목이 없어 원본 화면의 연령대별 도넛차트는 대표자 성별 구성으로 대체했습니다.</div>
  <div class="grid g3" style="margin-bottom:18px">
    <div class="card"><h3>조직형태별 사업체</h3><p class="sub">${YEAR}년 · 단위 개</p>${donut(org,'개')}</div>
    <div class="card"><h3>종사자규모별 사업체</h3><p class="sub">${YEAR}년 · 단위 개</p>${donut(size,'개')}</div>
    <div class="card"><h3>대표자 성별 사업체</h3><p class="sub">${YEAR}년 · 단위 개</p>
      ${donut(['남성','여성'].map(s=>({name:s+' 대표',value:R().sex[YEAR][s][0]})),'개')}</div>
  </div>
  <div class="grid g2">
    <div class="card"><h3>시도별 조직형태 구성비</h3><p class="sub">${YEAR}년 · 개인사업체 비중 · 단위 %</p>
      ${(()=>{const r=SIDO.map(x=>{const o=DB.regions[x].org[YEAR];const t=ORGS.reduce((a,k)=>a+(o[k]||0),0);
        return{x,v:t?+((o['개인']||0)/t*100).toFixed(1):null}}).sort((a,b)=>b.v-a.v);
        return barSVG(r.map(x=>SHORT[x.x]),[{name:'개인사업체 비중',data:r.map(x=>x.v)}],'%',{rotate:true,decimals:1,h:300,colorFn:l=>l===SHORT[REGION]?'#D8384B':'#1BA97E'})})()}</div>
    <div class="card"><h3>시도별 종사자 성별 구성</h3><p class="sub">${YEAR}년 · 단위 명</p>
      ${barSVG(SIDO.map(x=>SHORT[x]),[{name:'남성 종사자',data:SIDO.map(x=>DB.regions[x].empsex[YEAR][0]),color:'#2F5FE0'},
        {name:'여성 종사자',data:SIDO.map(x=>DB.regions[x].empsex[YEAR][1]),color:'#E874AE'}],'명',{rotate:true,h:300,wide:true})}</div>
  </div>`;
}
function renderFemale(){
  const sx=R().sex[YEAR],tot=totals(R().ind[YEAR]);
  const fi=INDS.map(i=>({name:i,value:(R().sexind[YEAR][i]||[0,0])[0]})).sort((a,b)=>b.value-a.value).slice(0,12);
  const rank=SIDO.map(x=>{const s=DB.regions[x].sex[YEAR],t=totals(DB.regions[x].ind[YEAR])[0];
    return{x,v:t?+((s['여성'][0])/t*100).toFixed(1):null}}).sort((a,b)=>b.v-a.v);
  const trend=YEARS.map(y=>{const s=DB.regions[REGION].sex[y],t=totals(DB.regions[REGION].ind[y])[0];
    return t?+((s['여성'][0])/t*100).toFixed(2):null});
  return head(`${SHORT[REGION]} 여성 대표 사업체 및 종사자 수`,REGION,`${YEAR}년 · 대표자 성별 기준 · 출처 국가데이터처 전국사업체조사 원자료 집계`)+
  `<div class="grid g4" style="margin-bottom:18px">
    <div class="card"><h3>여성 대표 사업체</h3><p class="sub">${YEAR}년</p><div class="kpi">${fmt(sx['여성'][0])}<small>개</small></div><div class="chg">비중 ${(sx['여성'][0]/tot[0]*100).toFixed(1)}%</div></div>
    <div class="card"><h3>여성 대표 사업체 종사자</h3><p class="sub">${YEAR}년</p><div class="kpi">${fmt(sx['여성'][1])}<small>명</small></div><div class="chg">비중 ${(sx['여성'][1]/tot[1]*100).toFixed(1)}%</div></div>
    <div class="card"><h3>남성 대표 사업체</h3><p class="sub">${YEAR}년</p><div class="kpi">${fmt(sx['남성'][0])}<small>개</small></div><div class="chg">비중 ${(sx['남성'][0]/tot[0]*100).toFixed(1)}%</div></div>
    <div class="card"><h3>여성 대표 사업체당 종사자</h3><p class="sub">${YEAR}년</p><div class="kpi">${(sx['여성'][1]/sx['여성'][0]).toFixed(1)}<small>명</small></div><div class="chg">남성 ${(sx['남성'][1]/sx['남성'][0]).toFixed(1)}명</div></div>
  </div>
  <div class="grid g2" style="margin-bottom:18px">
    <div class="card"><h3>${SHORT[REGION]} 여성 대표 사업체 산업 구성 상위 12</h3><p class="sub">${YEAR}년 · 단위 개</p>${hbarSVG(fi,'개')}</div>
    <div class="card"><h3>시도별 여성 대표 사업체 비중</h3><p class="sub">${YEAR}년 · 단위 %</p>
      ${barSVG(rank.map(x=>SHORT[x.x]),[{name:'여성 대표 비중',data:rank.map(x=>x.v)}],'%',{rotate:true,decimals:1,h:300,colorFn:l=>l===SHORT[REGION]?'#D8384B':'#E874AE'})}</div>
  </div>
  <div class="card"><h3>${SHORT[REGION]} 여성 대표 사업체 비중 추이</h3><p class="sub">단위 %</p>
    ${barSVG(YEARS,[{name:'여성 대표 비중',data:trend,color:'#E874AE'}],'%',{decimals:2,h:230})}</div>`;
}
const VIEWS=[{id:'overview',label:'산업 개요',fn:renderOverview},
             {id:'ind_type',label:'산업별 사업체 및 종사자 수',fn:renderIndType},
             {id:'char_type',label:'특성별 사업체 및 종사자 수',fn:renderCharType},
             {id:'female',label:'여성 대표 사업체 및 종사자 수',fn:renderFemale}];
function buildNav(){
  $('#nav').innerHTML=VIEWS.map(v=>`<button data-v="${v.id}" class="${v.id===VIEW?'on':''}">${esc(v.label)}</button>`).join('');
  $('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{VIEW=b.dataset.v;render()});
}
function buildGu(){
  const gl=gus();
  $('#guSel').innerHTML=`<option value="">${SHORT[REGION]} 전체</option>`+gl.map(g=>`<option value="${esc(g)}">${esc(g)}</option>`).join('');
  $('#guSel').value=GU&&gl.includes(GU)?GU:'';
  $('#guSel').disabled=!gl.length;
  const scoped=VIEW==='overview'||VIEW==='ind_type';
  $('#guSel').style.opacity=scoped?1:.45;
}
function render(){
  buildNav();buildGu();
  $('#main').innerHTML=VIEWS.find(v=>v.id===VIEW).fn()+
  `<p class="foot">본 화면은 공공데이터 실측값으로 구성되었습니다. (수집 2026-08-25)<br>
   국가데이터처 전국사업체조사 원자료 ${YEARS.join(' · ')}년 — ${YEARS.map(y=>fmt(SIDO.reduce((a,s)=>a+totals(DB.regions[s].ind[y])[0],0))).join(' / ')}개 사업체 전수 집계<br>
   16개 시도 · 252개 시군구 전환 지원 · 2026년 7월 1일 전남광주통합특별시 출범 반영 (광주·전남 합산)<br>
   원자료에 대표자 연령 항목이 없어 연령대별 화면은 대표자 성별로 대체했습니다.</p>`;
  window.scrollTo(0,0);
}
$('#yearSel').innerHTML=YEARS.map(y=>`<option value="${y}">${y}년</option>`).join('');
$('#yearSel').value=YEAR;
$('#regionSel').innerHTML=SIDO.map(s=>`<option value="${s}">${s}</option>`).join('');
$('#regionSel').value=REGION;
$('#yearSel').onchange=e=>{YEAR=e.target.value;render()};
$('#regionSel').onchange=e=>{REGION=e.target.value;GU=null;document.title=`${REGION} · 산업`;render()};
$('#guSel').onchange=e=>{GU=e.target.value||null;render()};
render();
</script></body></html>
