function lineChart(){
  const ys = RD.meta.years;
  const vals = ys.map(y=>ND().years[y].total);
  const W=540,H=165,m={l:52,r:12,t:10,b:30},pw=W-m.l-m.r,ph=H-m.t-m.b;
  const mx=Math.max(...vals)*1.15, mn=Math.min(...vals)*.7 || 0;
  let s=`<svg viewBox="0 0 ${W} ${H}">`;
  for(let k=0;k<4;k++){const y=m.t+ph*k/3;s+=`<line class="gridline" x1="${m.l}" y1="${y}" x2="${W-m.r}" y2="${y}"/>`}
  const px=i=>ys.length>1 ? m.l+pw*i/(ys.length-1) : m.l+pw/2;
  const py=v=>m.t+ph-(v-mn)/((mx-mn)||1)*ph;
  s+=`<polyline fill="none" stroke="#df6282" stroke-width="3" points="${vals.map((v,i)=>px(i)+','+py(v)).join(' ')}"/>`;
  vals.forEach((v,i)=>{
    s+=`<circle data-tip="${ys[i]}년 ${ITEM}: ${F(v)}kg" cx="${px(i)}" cy="${py(v)}" r="5" fill="#df6282"/>`;
    s+=`<text class="axis" text-anchor="middle" x="${px(i)}" y="${H-7}">${ys[i]}</text>`;
    s+=`<text x="${px(i)}" y="${py(v)+22}" text-anchor="middle" fill="#d54f76" font-size="9">${F(v)}kg</text>`;
  });
  return s+'</svg>';
}

function renderMap(){

      <div class="gbar"><span style="width:${Math.round((v||0)/mx*100)}%;background:#5e83aa"
        data-tip="선택농가 ${v??'미측정'}"></span></div>
      <div class="gval"><b style="color:#df6970">${s??'—'}</b> vs <b style="color:#5e83aa">${v??'—'}</b>
        ${d!==null?`<span style="color:${d>=0?'#0f8a5f':'#d54f76'}"> (${d>=0?'+':''}${d}%)</span>`:''}</div>
    </div>`;
  }).join('') + (inf ? `<div class="gcard info"><h4>재배 정보</h4>
      <div class="ginfo">품종 : ${inf.variety||'—'}<br>온실 : ${inf.house||'—'} ${inf.type||''}<br>
      식부면적 : ${inf.area?F(inf.area)+'㎡':'—'}<br>재식밀도 : ${inf.density||'—'}</div></div>` : '');
}
function fillSelectors(){
  const ys = RD.meta.years;
  const yl = document.getElementById('yearSel');
  const prevY = yl.value;
  yl.innerHTML = ys.map(y=>`<option>${y}</option>`).join('');
  yl.value = ys.includes(prevY) ? prevY : ys[ys.length-1];
  state.year = yl.value;

  const sdl = document.getElementById('sidoSel');
  const avail = Object.keys(YR().by_sido||{});
  [...sdl.options].forEach(o=>{ o.disabled = !avail.includes(o.value); });
  if(!avail.includes(SD) && avail.length){ SD = avail[0]; sdl.value = SD; }

  const gl = guList();
  const gs = document.getElementById('guSel');
  const prevG = gs.value;
  gs.innerHTML = `<option value="">${SHORT[SD]} 전체</option>` + gl.map(g=>`<option>${g}</option>`).join('');
  if(gl.includes(prevG)) gs.value = prevG;

  farms = farmList();
  const fs = document.getElementById('farmSel');
  fs.innerHTML = farms.length ? farms.map(f=>`<option>${f}</option>`).join('')
                              : '<option value="">농가 자료 없음</option>';
  if(!farms.includes(state.farm)) state.farm = farms[0] || '';
  fs.value = state.farm;

  const y = YR(), bs = (y.by_sido||{})[SD];
  document.getElementById('ctlNote').innerHTML = bs
    ? `${SHORT[SD]} ${ITEM} · 출하 ${F(bs.qty)}kg · 농가 ${bs.farms}호`
    : `<b style="color:#d54f76">${SHORT[SD]}는 ${V('yearSel')}년 ${ITEM} 자료가 없습니다</b>`;
  document.querySelectorAll('[data-item-label]').forEach(e=>e.textContent = ITEM);
  document.querySelectorAll('[data-brand]').forEach(e=>e.textContent = SHORT[SD] + ' 데이터허브');
  document.title = SHORT[SD] + ' ' + ITEM + ' 생육·출하 분석';
}
function renderAll(){
  fillSelectors();
  renderYear(); renderMap(); renderSeason(); renderHeat(); renderGrowth(); bindTips();
}
const fs=document.getElementById('farmSel');farms.forEach(f=>fs.insertAdjacentHTML('beforeend',`<option>${f}</option>`));fs.value=state.farm;document.getElementById('yearSel').value=state.year;document.getElementById('applyBtn').onclick=()=>{state.year=Number(document.getElementById('yearSel').value);state.farm=fs.value;renderAll()};document.getElementById('aiBtn').onclick=()=>{const box=document.getElementById('aiBox');box.innerHTML=`<b>AI 컨설팅 요약(임시)</b><br>농가 ${state.farm}의 ${state.year}년 생육지표를 표준농가와 비교했습니다. 출하량이 전년 대비 감소한 구간과 표준치 대비 생육 편차가 큰 항목을 우선 점검하고, 해당 작기의 온·습도와 양액 조건을 함께 확인하는 것이 좋습니다.`;box.classList.toggle('show')};document.getElementById('downloadBtn').onclick=()=>{const csv='항목,값\n기준연도,'+state.year+'\n농가,'+state.farm+'\n';const b=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='딸기_생육출하_요약.csv';a.click();URL.revokeObjectURL(a.href)};renderAll();


(function(){
  const it=document.getElementById('itemSel'), sd=document.getElementById('sidoSel'),
        gu=document.getElementById('guSel'),  yr=document.getElementById('yearSel'),
        fm=document.getElementById('farmSel'), ap=document.getElementById('applyBtn');
  it.value = ITEM; sd.value = SD;
  it.addEventListener('change', e=>{ ITEM=e.target.value; state.farm=''; renderAll();
    document.title = ITEM + ' 생육·출하 분석'; });
  sd.addEventListener('change', e=>{ SD=e.target.value; state.farm=''; renderAll(); });
  gu.addEventListener('change', ()=>{ state.farm=''; renderAll(); });
  yr.addEventListener('change', e=>{ state.year=e.target.value; renderAll(); });
  fm.addEventListener('change', e=>{ state.farm=e.target.value; renderHeat(); renderGrowth(); bindTips(); });
  if(ap) ap.addEventListener('click', renderAll);
  renderAll();
})();
