<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공공와이파이 현황</title>
<style>
:root{
  --navy:#123a6b; --blue:#1a5fb4; --blue-d:#0f4a94; --line:#d5dee9;
  --bg:#eef2f7; --card:#fff; --ink:#1b2733; --mute:#6b7c90;
  --teal:#3fbfa8; --indigo:#5b5fc7; --lilac:#8b8fe0; --red:#d94a4a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1420px;margin:0 auto;padding:14px}

/* header */
.top{background:var(--navy);color:#fff;border-radius:4px 4px 0 0;padding:11px 16px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.02em}
.top .sub{font-size:11.5px;color:#a9c2e0}
.top .badge{margin-left:auto;font-size:11px;background:rgba(255,255,255,.13);
  padding:3px 9px;border-radius:11px;color:#dbe8f7}

/* region tabs */
.regions{background:#fff;border:1px solid var(--line);border-top:0;padding:9px 12px;
  display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.rlabel{font-size:11.5px;color:var(--mute);font-weight:600;margin-right:4px}
.rbtn{border:1px solid var(--line);background:#f7f9fc;color:#3c4a5a;border-radius:3px;
  padding:5px 11px;font-size:12.5px;cursor:pointer;font-family:inherit;transition:.12s}
.rbtn:hover:not(:disabled){border-color:var(--blue);color:var(--blue)}
.rbtn.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.rbtn:disabled{opacity:.42;cursor:not-allowed;background:#f1f3f6;color:#9aa7b5;
  text-decoration:none}
.rbtn:focus-visible{outline:2px solid #0f4a94;outline-offset:1px}

/* filter bar */
.filters{background:#f4f7fb;border:1px solid var(--line);border-top:0;padding:10px 12px;
  display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.fg{display:flex;align-items:center;gap:6px}
.fg > label{font-size:12px;color:#3c4a5a;font-weight:600}
select{font-family:inherit;font-size:12.5px;padding:5px 8px;border:1px solid #b9c6d4;
  border-radius:3px;background:#fff;color:var(--ink);min-width:120px}
select:focus-visible{outline:2px solid #0f4a94;outline-offset:1px}
.radios{display:flex;gap:2px;border:1px solid #b9c6d4;border-radius:3px;overflow:hidden;background:#fff}
.radios label{font-size:12px;padding:5px 11px;cursor:pointer;color:#4a5a6b;background:#fff}
.radios input{position:absolute;opacity:0;pointer-events:none}
.radios input:checked + span{color:#fff}
.radios label:has(input:checked){background:var(--blue);color:#fff;font-weight:600}
.radios label:has(input:focus-visible){outline:2px solid #0f4a94;outline-offset:-2px}
.searchbtn{background:var(--blue-d);color:#fff;border:0;border-radius:3px;padding:6px 18px;
  font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit}
.searchbtn:hover{background:#0b3a75}
.note{font-size:11px;color:var(--mute);margin-left:auto}

/* kpi */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:11px 13px;
  border-left:3px solid var(--blue)}
.kpi .k{font-size:11.5px;color:var(--mute);font-weight:600}
.kpi .v{font-size:22px;font-weight:700;letter-spacing:-.03em;margin-top:2px;
  font-variant-numeric:tabular-nums}
.kpi .u{font-size:11.5px;color:var(--mute);font-weight:500;margin-left:3px}

/* grid */
.row{display:grid;gap:10px;margin-bottom:10px}
.row.two{grid-template-columns:400px 1fr}
.row.two-eq{grid-template-columns:1fr 1fr}
.panel{background:var(--card);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.phead{display:flex;align-items:center;gap:7px;padding:8px 12px;border-bottom:1px solid #e6ecf3;
  background:#fafcfe}
.dot{width:7px;height:7px;border-radius:50%;border:2px solid var(--red);flex:none}
.phead h2{margin:0;font-size:13px;font-weight:700;letter-spacing:-.02em}
.phead .unit{font-size:11px;color:var(--mute);font-weight:500}
.dl{margin-left:auto;border:1px solid #b9c6d4;background:#fff;border-radius:3px;
  padding:3px 9px;font-size:11px;cursor:pointer;font-family:inherit;color:#3c4a5a}
.dl:hover{border-color:var(--blue);color:var(--blue)}
.pbody{padding:11px 12px}

/* cartogram */
.cart{display:grid;gap:3px;justify-content:center}
.tile{aspect-ratio:1/.82;border-radius:3px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;cursor:pointer;border:1.5px solid transparent;
  transition:.1s;padding:2px}
.tile span{font-size:10px;font-weight:600;line-height:1.15;text-align:center}
.tile b{font-size:9.5px;font-weight:700;opacity:.82;font-variant-numeric:tabular-nums}
.tile:hover{border-color:#12325c;transform:scale(1.06);z-index:2}
.tile.sel{border-color:#f0a500;border-width:2.5px}
.legend{display:flex;align-items:center;gap:0;margin-top:10px;justify-content:center}
.legend i{width:26px;height:11px;display:block}
.legend .lb{font-size:10px;color:var(--mute);margin:0 5px;font-variant-numeric:tabular-nums}

/* table */
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:#eef3f9;color:#33455c;font-weight:700;padding:6px 7px;text-align:center;
  border-bottom:1px solid #d5dee9;position:sticky;top:0;font-size:11.5px;white-space:nowrap}
td{padding:5px 7px;border-bottom:1px solid #eef2f6;font-variant-numeric:tabular-nums}
td.l{text-align:left}td.r{text-align:right}td.c{text-align:center}
tbody tr:hover{background:#f3f8ff}
tbody tr.sel{background:#fff6e0}
.scroll{max-height:295px;overflow:auto}
.rank{display:inline-block;width:17px;height:17px;line-height:17px;border-radius:50%;
  background:#e8eef6;color:#33455c;font-size:10px;font-weight:700;text-align:center}
.rank.t3{background:var(--blue);color:#fff}

/* tooltip */
#tip{position:fixed;z-index:99;pointer-events:none;background:rgba(28,38,50,.96);color:#fff;
  border-radius:4px;padding:8px 10px;font-size:11.5px;display:none;min-width:150px;
  box-shadow:0 6px 18px rgba(0,0,0,.25)}
#tip .tt{font-weight:700;font-size:12px;margin-bottom:5px;padding-bottom:4px;
  border-bottom:1px solid rgba(255,255,255,.2)}
#tip .tr{display:flex;align-items:center;gap:6px;margin:2px 0}
#tip .tr i{width:9px;height:9px;border-radius:2px;flex:none}
#tip .tr em{font-style:normal;color:#c8d6e6}
#tip .tr b{margin-left:auto;font-variant-numeric:tabular-nums}
#tip .sum{margin-top:5px;padding-top:4px;border-top:1px solid rgba(255,255,255,.2);
  display:flex;font-weight:700}
#tip .sum b{margin-left:auto;font-variant-numeric:tabular-nums}

/* chart legend */
.clegend{display:flex;gap:14px;padding:0 12px 8px;flex-wrap:wrap}
.clegend span{display:flex;align-items:center;gap:5px;font-size:11.5px;color:#4a5a6b}
.clegend i{width:11px;height:11px;border-radius:2px}
svg{display:block;width:100%;height:auto}
.bar{cursor:pointer}
.bar:hover{opacity:.8}

.foot{background:#fff;border:1px solid var(--line);border-radius:4px;padding:12px 14px;
  font-size:11.5px;color:#4a5a6b;line-height:1.65}
.foot h3{margin:0 0 6px;font-size:12.5px;color:var(--navy)}
.foot code{background:#f0f4f9;padding:1px 4px;border-radius:2px;font-size:11px}
.foot a{color:var(--blue)}
.warn{border-left:3px solid #e8a33d;background:#fdf8ef;padding:8px 11px;margin:8px 0 0;
  border-radius:0 3px 3px 0}
.empty{padding:34px 12px;text-align:center;color:var(--mute);font-size:12px}

@media(max-width:1080px){
  .row.two,.row.two-eq{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,1fr)}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <h1>공공와이파이 현황</h1>
    <span class="sub">지역 · 자치구 · 유형별 AP 이용량 분석</span>
    <span class="badge" id="srcBadge">—</span>
  </div>

  <div class="regions" id="regions">
    <span class="rlabel">지역</span>
  </div>

  <div class="filters">
    <div class="fg">
      <label for="period">조회기간</label>
      <select id="period"></select>
    </div>
    <div class="fg">
      <label for="gu">구 · 군</label>
      <select id="gu"></select>
    </div>
    <div class="fg">
      <label>지표</label>
      <div class="radios" id="metric">
        <label><input type="radio" name="m" value="gb" checked><span>사용량(GB)</span></label>
        <label><input type="radio" name="m" value="n"><span>AP 수</span></label>
        <label><input type="radio" name="m" value="avg"><span>AP당 평균</span></label>
      </div>
    </div>
    <button class="searchbtn" id="search">검색</button>
    <span class="note" id="fnote"></span>
  </div>

  <div class="kpis" id="kpis"></div>

  <div class="row two">
    <div class="panel">
      <div class="phead"><i class="dot"></i><h2 id="mapTitle">지역별 이용 현황</h2>
        <span class="unit" id="mapUnit"></span></div>
      <div class="pbody">
        <div class="cart" id="cart"></div>
        <div class="legend" id="legend"></div>
      </div>
    </div>
    <div class="panel">
      <div class="phead"><i class="dot"></i><h2>구별 유형 구성</h2>
        <span class="unit" id="barUnit"></span>
        <button class="dl" id="dlBar">다운로드</button></div>
      <div class="clegend" id="barLegend"></div>
      <div class="pbody" style="padding-top:0"><div id="barChart"></div></div>
    </div>
  </div>

  <div class="row two-eq">
    <div class="panel">
      <div class="phead"><i class="dot"></i><h2>구별 와이파이 AP 및 이용량</h2>
        <button class="dl" id="dlTable">다운로드</button></div>
      <div class="scroll"><table id="guTable"></table></div>
    </div>
    <div class="panel">
      <div class="phead"><i class="dot"></i><h2 id="topTitle">AP별 이용실적 Top10</h2>
        <button class="dl" id="dlTop">다운로드</button></div>
      <div class="scroll"><table id="topTable"></table></div>
    </div>
  </div>

  <div class="row">
    <div class="panel">
      <div class="phead"><i class="dot"></i><h2>서비스 유형별 총 이용량</h2>
        <span class="unit">단위: GB · 하단 막대에 마우스를 올리면 상세 수치</span></div>
      <div class="clegend" id="typeLegend"></div>
      <div class="pbody" style="padding-top:0"><div id="typeChart"></div></div>
    </div>
  </div>

  <div class="foot" id="foot"></div>
</div>

/* ---------- 유틸 ---------- */
const fmt = n => n >= 1000 ? Math.round(n).toLocaleString('ko-KR')
                           : (Math.round(n * 10) / 10).toLocaleString('ko-KR');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function rows() {
  const d = DATA[state.region].districts;
  return Object.keys(d).map(g => {
    const f = d[g].fixed, v = d[g].village;
    const n = f.n + v.n, gb = f.gb + v.gb;
    return {gu:g, fn:f.n, fgb:f.gb, vn:v.n, vgb:v.gb, n, gb, avg:n ? gb / n : 0};
  });
}
const val = r => state.metric === 'n' ? r.n : state.metric === 'avg' ? r.avg : r.gb;
const metricLabel = () => state.metric === 'n' ? 'AP 수(대)'
  : state.metric === 'avg' ? 'AP당 평균 이용량(GB)' : '총 이용량(GB)';
const metricUnit = () => state.metric === 'n' ? '대' : 'GB';

function showTip(e, html) {
  tip.innerHTML = html; tip.style.display = 'block';
  const r = tip.getBoundingClientRect();
  let x = e.clientX + 14, y = e.clientY + 14;
  if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 14;
  if (y + r.height > innerHeight - 8) y = e.clientY - r.height - 14;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
const hideTip = () => tip.style.display = 'none';

function tipHTML(title, series, sumLabel) {
  let h = '<div class="tt">' + esc(title) + '</div>';
  series.forEach(s => {
    h += '<div class="tr"><i style="background:' + s.c + '"></i><em>' + esc(s.k) +
         '</em><b>' + s.v + '</b></div>';
  });
  if (sumLabel) h += '<div class="sum"><span>' + esc(sumLabel.k) + '</span><b>' + sumLabel.v + '</b></div>';
  return h;
}

/* ---------- 지역 버튼 ---------- */
function buildRegions() {
  const box = $('#regions');
  REGIONS.forEach(r => {
    const b = document.createElement('button');
    b.className = 'rbtn' + (r.id === state.region ? ' on' : '');
    b.textContent = r.name;
    b.disabled = !r.on;
    b.title = r.on ? META[r.id].src : '개방 데이터 미보유 — 해당 지자체 협조 필요';
    if (r.on) b.onclick = () => { state.region = r.id; state.gu = '전체'; buildControls(); render();
      box.querySelectorAll('.rbtn').forEach(x => x.classList.remove('on')); b.classList.add('on'); };
    box.appendChild(b);
  });
}

  p.value = 'all';

  const g = $('#gu'); g.innerHTML = '<option value="전체">전체</option>';
  rows().sort((a, b) => a.gu.localeCompare(b.gu, 'ko')).forEach(r => {
    const o = document.createElement('option'); o.value = r.gu; o.textContent = r.gu; g.appendChild(o);
  });
  g.value = state.gu;
  $('#srcBadge').textContent = m.label + ' · ' + m.periods[0][1];
  $('#fnote').textContent = '개방 원천에 이용자수·월별 컬럼이 없어 지표를 AP 수·이용량 기준으로 구성';
}

/* ---------- KPI ---------- */
function renderKPI() {
  const rs = rows();
  const sel = state.gu === '전체' ? rs : rs.filter(r => r.gu === state.gu);
  const n = sel.reduce((a, r) => a + r.n, 0);
  const gb = sel.reduce((a, r) => a + r.gb, 0);
  const cb = state.gu === '전체' ? DATA[state.region].citybus : {n:0, gb:0};
  const top = [...sel].sort((a, b) => b.gb - a.gb)[0];
  const items = [
    ['총 AP 수', fmt(n + cb.n), '대'],
    ['총 이용량', fmt(gb + cb.gb), 'GB'],
    ['AP당 평균 이용량', fmt((gb + cb.gb) / Math.max(1, n + cb.n)), 'GB'],
    [state.gu === '전체' ? '이용량 1위 지역' : '선택 지역', top ? top.gu : '-',
      top ? fmt(top.gb) + ' GB' : '']
  ];
  $('#kpis').innerHTML = items.map(([k, v, u]) =>
    `<div class="kpi"><div class="k">${esc(k)}</div><div class="v">${esc(v)}<span class="u">${esc(u)}</span></div></div>`
  ).join('');
}

/* ---------- 카토그램 ---------- */
function renderCart() {
  const m = META[state.region], rs = rows();
  const map = {}; rs.forEach(r => map[r.gu] = r);
  const vals = rs.map(val), max = Math.max(...vals), min = Math.min(...vals);
  const c = $('#cart');
  c.style.gridTemplateColumns = `repeat(${m.cols},minmax(46px,58px))`;
  c.innerHTML = '';
  Object.entries(m.grid).forEach(([gu, [col, row]]) => {
    const r = map[gu]; if (!r) return;
    const t = max === min ? .5 : (val(r) - min) / (max - min);
    const idx = Math.min(RAMP.length - 1, Math.floor(t * RAMP.length));
    const el = document.createElement('div');
    el.className = 'tile' + (state.gu === gu ? ' sel' : '');
    el.style.gridColumn = col; el.style.gridRow = row;
    el.style.background = RAMP[idx];
    el.style.color = idx >= 4 ? '#fff' : '#123a6b';
    el.innerHTML = `<span>${esc(gu)}</span><b>${fmt(val(r))}</b>`;
    el.onmousemove = e => showTip(e, tipHTML(gu, [
      {k:'고정형 AP', c:C_FIXED, v:fmt(r.fn) + '대'},
      {k:'고정형 이용량', c:C_FIXED, v:fmt(r.fgb) + 'GB'},
      {k:'마을버스 AP', c:C_VILL, v:fmt(r.vn) + '대'},
      {k:'마을버스 이용량', c:C_VILL, v:fmt(r.vgb) + 'GB'}
    ], {k:'합계 이용량', v:fmt(r.gb) + 'GB'}));
    el.onmouseleave = hideTip;
    el.onclick = () => { state.gu = state.gu === gu ? '전체' : gu; $('#gu').value = state.gu; render(); };
    c.appendChild(el);
  });
  $('#mapTitle').textContent = META[state.region].label + ' 와이파이 사용현황';
  $('#mapUnit').textContent = '단위: ' + metricUnit() + ' · 타일 카토그램(모식도)';
  $('#legend').innerHTML = `<span class="lb">${fmt(min)}</span>` +
    RAMP.map(c => `<i style="background:${c}"></i>`).join('') +
    `<span class="lb">${fmt(max)}</span>`;
}

/* ---------- 스택 막대 ---------- */
function renderBar() {
  const rs = rows().sort((a, b) => val(b) - val(a));
  const W = 900, H = 320, pad = {t:14, r:14, b:64, l:52};
  const iw = W - pad.l - pad.r, ih = H - pad.t - pad.b;
  const stacked = state.metric !== 'avg';
  const max = Math.max(...rs.map(val)) * 1.08 || 1;
  const bw = iw / rs.length, w = Math.min(30, bw * .62);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="구별 유형 구성 막대그래프">`;

  for (let i = 0; i <= 4; i++) {
    const y = pad.t + ih - ih * i / 4;
    s += `<line x1="${pad.l}" y1="${y}" x2="${W - pad.r}" y2="${y}" stroke="#e8eef5"/>` +
         `<text x="${pad.l - 6}" y="${y + 3.5}" text-anchor="end" font-size="10" fill="#8794a5">${fmt(max * i / 4)}</text>`;
  }

  rs.forEach((r, i) => {
    const cx = pad.l + bw * i + bw / 2, x = cx - w / 2;
    const on = state.gu === '전체' || state.gu === r.gu;
    const op = on ? 1 : .28;
    if (stacked) {
      const a = state.metric === 'n' ? r.fn : r.fgb;
      const b = state.metric === 'n' ? r.vn : r.vgb;
      const ha = ih * a / max, hb = ih * b / max;
      s += `<rect class="bar" data-i="${i}" x="${x}" y="${pad.t + ih - ha}" width="${w}" height="${ha}" fill="${C_FIXED}" opacity="${op}"/>`;
      if (hb > 0) s += `<rect class="bar" data-i="${i}" x="${x}" y="${pad.t + ih - ha - hb}" width="${w}" height="${hb}" fill="${C_VILL}" opacity="${op}"/>`;
    } else {
      const h = ih * r.avg / max;
      s += `<rect class="bar" data-i="${i}" x="${x}" y="${pad.t + ih - h}" width="${w}" height="${h}" fill="${C_FIXED}" opacity="${op}"/>`;
    }
    s += `<text x="${cx}" y="${H - pad.b + 14}" text-anchor="end" font-size="10" fill="#5a6b7d" transform="rotate(-45 ${cx} ${H - pad.b + 14})" opacity="${op}">${esc(r.gu)}</text>`;
  });
  s += `<line x1="${pad.l}" y1="${pad.t + ih}" x2="${W - pad.r}" y2="${pad.t + ih}" stroke="#b9c6d4"/></svg>`;
  $('#barChart').innerHTML = s;

  $('#barChart').querySelectorAll('.bar').forEach(el => {
    const r = rs[+el.dataset.i];
    el.onmousemove = e => showTip(e, tipHTML(r.gu,
      state.metric === 'avg'
        ? [{k:'AP당 평균', c:C_FIXED, v:fmt(r.avg) + 'GB'}, {k:'AP 수', c:'#b9c6d4', v:fmt(r.n) + '대'}]
        : [{k:'고정형(공공장소)', c:C_FIXED, v:fmt(state.metric === 'n' ? r.fn : r.fgb) + (state.metric === 'n' ? '대' : 'GB')},
           {k:'마을버스', c:C_VILL, v:fmt(state.metric === 'n' ? r.vn : r.vgb) + (state.metric === 'n' ? '대' : 'GB')}],
      state.metric === 'avg' ? null : {k:'합계', v:fmt(val(r)) + metricUnit()}));
    el.onmouseleave = hideTip;
    el.onclick = () => { state.gu = state.gu === r.gu ? '전체' : r.gu; $('#gu').value = state.gu; render(); };
  });

  $('#barUnit').textContent = metricLabel() + ' · 내림차순';
  $('#barLegend').innerHTML = state.metric === 'avg'
    ? `<span><i style="background:${C_FIXED}"></i>AP당 평균</span>`
    : `<span><i style="background:${C_FIXED}"></i>고정형(공공장소)</span>` +
      `<span><i style="background:${C_VILL}"></i>마을버스</span>`;
}

/* ---------- 유형별 총량 ---------- */
function renderType() {
  const rs = rows();
  const f = {k:'고정형(공공장소)', c:C_FIXED, n:rs.reduce((a, r) => a + r.fn, 0), gb:rs.reduce((a, r) => a + r.fgb, 0)};
  const v = {k:'마을버스', c:C_VILL, n:rs.reduce((a, r) => a + r.vn, 0), gb:rs.reduce((a, r) => a + r.vgb, 0)};
  const cb = DATA[state.region].citybus;
  const c = {k:'시내버스', c:C_CITY, n:cb.n, gb:cb.gb};
  const items = [f, v, c].filter(x => x.gb > 0);
  const tot = items.reduce((a, x) => a + x.gb, 0) || 1;

  const W = 900, H = 92, pad = 14, iw = W - pad * 2;
  let x = pad, s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="유형별 총 이용량">`;
  items.forEach((it, i) => {
    const w = iw * it.gb / tot;
    s += `<rect class="bar" data-i="${i}" x="${x}" y="20" width="${Math.max(0, w - 2)}" height="40" fill="${it.c}" rx="2"/>`;
    if (w > 78) {
      s += `<text x="${x + w / 2}" y="45" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">${fmt(it.gb)} GB</text>`;
      s += `<text x="${x + w / 2}" y="74" text-anchor="middle" font-size="11" fill="#5a6b7d">${esc(it.k)} · ${(it.gb / tot * 100).toFixed(1)}%</text>`;
    }
    x += w;
  });
  s += '</svg>';
  $('#typeChart').innerHTML = s;
  $('#typeChart').querySelectorAll('.bar').forEach(el => {
    const it = items[+el.dataset.i];
    el.onmousemove = e => showTip(e, tipHTML(it.k, [
      {k:'AP 수', c:it.c, v:fmt(it.n) + '대'},
      {k:'총 이용량', c:it.c, v:fmt(it.gb) + 'GB'},
      {k:'AP당 평균', c:it.c, v:fmt(it.gb / Math.max(1, it.n)) + 'GB'}
    ], {k:'전체 대비', v:(it.gb / tot * 100).toFixed(1) + '%'}));
    el.onmouseleave = hideTip;
  });
  $('#typeLegend').innerHTML = items.map(it =>
    `<span><i style="background:${it.c}"></i>${esc(it.k)} · AP ${fmt(it.n)}대</span>`).join('');
}

/* ---------- 표 ---------- */
function renderTables() {
  const rs = rows().sort((a, b) => val(b) - val(a));
  let h = '<thead><tr><th>순위</th><th>구·군</th><th>고정형 AP</th><th>마을버스 AP</th>' +
          '<th>고정형 이용량</th><th>마을버스 이용량</th><th>합계(GB)</th><th>AP당 평균</th></tr></thead><tbody>';
  rs.forEach((r, i) => {
    h += `<tr class="${state.gu === r.gu ? 'sel' : ''}" data-gu="${esc(r.gu)}">` +
      `<td class="c"><span class="rank ${i < 3 ? 't3' : ''}">${i + 1}</span></td>` +
      `<td class="l">${esc(r.gu)}</td><td class="r">${fmt(r.fn)}</td><td class="r">${fmt(r.vn)}</td>` +
      `<td class="r">${fmt(r.fgb)}</td><td class="r">${fmt(r.vgb)}</td>` +
      `<td class="r"><b>${fmt(r.gb)}</b></td><td class="r">${fmt(r.avg)}</td></tr>`;
  });
  $('#guTable').innerHTML = h + '</tbody>';
  $('#guTable').querySelectorAll('tbody tr').forEach(tr => tr.onclick = () => {
    state.gu = state.gu === tr.dataset.gu ? '전체' : tr.dataset.gu;
    $('#gu').value = state.gu; render();
  });

  const T = DATA[state.region].top;
  let list = [];
  if (state.gu === '전체') {
    Object.entries(T).forEach(([g, o]) => {
      o.fixed.forEach(([id, gb]) => list.push([g, '고정형', id, gb]));
      o.village.forEach(([id, gb]) => list.push([g, '마을버스', id, gb]));
    });
    DATA[state.region].citybusTop.forEach(([id, gb]) => list.push(['-', '시내버스', id, gb]));
  } else {
    const o = T[state.gu] || {fixed:[], village:[]};
    o.fixed.forEach(([id, gb]) => list.push([state.gu, '고정형', id, gb]));
    o.village.forEach(([id, gb]) => list.push([state.gu, '마을버스', id, gb]));
  }
  list.sort((a, b) => b[3] - a[3]);
  const top = list.slice(0, 10);
  $('#topTitle').textContent = (state.gu === '전체' ? META[state.region].label : state.gu) + ' AP별 이용실적 Top10';
  if (!top.length) { $('#topTable').innerHTML = '<tbody><tr><td class="empty">해당 지역의 AP 데이터가 없습니다.</td></tr></tbody>'; return; }
  let t = '<thead><tr><th>순위</th><th>구·군</th><th>유형</th><th>AP 관리번호 · 차량</th><th>이용량(GB)</th></tr></thead><tbody>';
  top.forEach((r, i) => {
    const col = r[1] === '고정형' ? C_FIXED : r[1] === '마을버스' ? C_VILL : C_CITY;
    t += `<tr><td class="c"><span class="rank ${i < 3 ? 't3' : ''}">${i + 1}</span></td>` +
      `<td class="c">${esc(r[0])}</td>` +
      `<td class="c"><span style="color:${col};font-weight:700">${esc(r[1])}</span></td>` +
      `<td class="l">${esc(r[2])}</td><td class="r"><b>${fmt(r[3])}</b></td></tr>`;
  });
  $('#topTable').innerHTML = t + '</tbody>';
  window.__top = top;
}

/* ---------- 다운로드 ---------- */
function csv(name, header, body) {
  const txt = '\uFEFF' + [header, ...body].map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([txt], {type:'text/csv;charset=utf-8'}));
  a.download = name; a.click(); URL.revokeObjectURL(a.href);
}

/* ---------- 안내 ---------- */
function renderFoot() {
  const m = META[state.region];
  $('#foot').innerHTML = `
    <h3>데이터 출처 및 확인 사항</h3>
    <div><b>원천:</b> ${esc(m.src)}</div>
    <div><b>서울:</b> <code>관리번호, 자치구, AP별 이용량(GB)</code> — 고정형 10,191대 · 시내버스 7,370대 · 마을버스 1,583대.
      마을버스 자치구는 노선명 접두어(예: <code>청화운수_서초09_서울70사9239</code> → 서초구)에서 추출했습니다.
      시내버스는 노선번호에 자치구 정보가 없어 구별로 배분하지 않고 전체 합계로만 표시합니다.</div>
    <div><b>부산:</b> <code>관리번호, 시군구, AP당 이용량(GB)</code> — 3,568대. 유형 구분 컬럼이 없어 전량 고정형으로 처리했습니다.</div>
    <div class="warn"><b>월별 추이와 이용자수는 표시하지 않습니다.</b> 두 개방 파일 모두 기간 누적 단일 값이며 날짜·이용자수 컬럼이 없습니다.
      값을 만들어 넣지 않기 위해 조회기간의 월 단위 항목과 데이터 미보유 지역은 비활성화 상태로 두었습니다.
      월별·행정동별 이용자수가 필요하면 해당 지자체 공공와이파이 통합관리시스템 운영 부서에 데이터 제공 협조를 요청해야 합니다.</div>`;
}

/* ---------- 렌더 ---------- */
function render() {
  renderKPI(); renderCart(); renderBar(); renderType(); renderTables(); renderFoot();
}

buildRegions(); buildControls(); render();

$('#gu').onchange = e => { state.gu = e.target.value; render(); };
$('#metric').onchange = e => { state.metric = e.target.value; render(); };
$('#search').onclick = () => render();
$('#period').onchange = () => render();
addEventListener('scroll', hideTip, {passive:true});

$('#dlTable').onclick = () => csv(`${META[state.region].label}_구별_와이파이.csv`,
  ['구군', '고정형AP', '마을버스AP', '고정형이용량GB', '마을버스이용량GB', '합계GB', 'AP당평균GB'],
  rows().sort((a, b) => b.gb - a.gb).map(r => [r.gu, r.fn, r.vn, r.fgb, r.vgb, r.gb, Math.round(r.avg * 10) / 10]));
$('#dlBar').onclick = () => csv(`${META[state.region].label}_유형구성.csv`,
  ['구군', '고정형', '마을버스', '합계'],
  rows().sort((a, b) => b.gb - a.gb).map(r => [r.gu, r.fgb, r.vgb, r.gb]));
$('#dlTop').onclick = () => csv(`${META[state.region].label}_${state.gu}_TOP10.csv`,
  ['순위', '구군', '유형', 'AP', '이용량GB'],
  (window.__top || []).map((r, i) => [i + 1, r[0], r[1], r[2], r[3]]));
</script>
