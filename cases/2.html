<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>경제 구조·성장 대시보드</title>
<style>
:root{--ink:#10232b;--muted:#68777e;--teal:#008f7a;--bg:#eef4f6;--line:#dce5e8;--blue:#2F5FE0;--orange:#F0994D;--red:#D8384B}
*{box-sizing:border-box}body{margin:0;color:var(--ink);background:#f6f9fa;font-family:Pretendard,"Malgun Gothic",Arial,sans-serif}
button,select{font:inherit;color:inherit}button{cursor:pointer}
.header{height:76px;display:flex;align-items:center;gap:18px;padding:0 28px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:13px 13px 13px 4px;background:linear-gradient(145deg,#2F5FE0,#16A085);color:#fff;font-weight:900;font-size:22px;display:grid;place-items:center}
.brand b{font-size:17px;display:block;line-height:1.15}.brand small{font-size:11px;color:var(--muted);letter-spacing:.06em}
.region-picker{display:flex;align-items:center;gap:8px;margin-left:auto}
.region-picker label{font-size:13px;color:var(--muted);font-weight:700}
.region-picker select{padding:9px 13px;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:800;min-width:160px}
.wrap{display:grid;grid-template-columns:230px 1fr;gap:0;min-height:calc(100vh - 76px)}
.side{background:#fff;border-right:1px solid var(--line);padding:20px 14px}
.side h4{margin:0 0 12px;font-size:12px;color:var(--muted);letter-spacing:.05em}
.side button{display:block;width:100%;text-align:left;border:0;background:none;padding:11px 12px;border-radius:9px;font-size:13.5px;line-height:1.4;color:#3d4a51;margin-bottom:3px}
.side button:hover{background:#f2f7f9}.side button.on{background:#eaf1fd;color:var(--blue);font-weight:800}
.side button.off{color:#b4bec4}
.main{padding:26px 30px 60px;max-width:1500px}
.ttl{display:flex;align-items:center;gap:11px;margin:0 0 6px;font-size:23px}
.badge{padding:3px 11px;border-radius:999px;background:#eaf1fd;color:var(--blue);font-size:12px;font-weight:800}
.badge.gray{background:#eef1f2;color:#7b868c}.badge.warn{background:#fdecec;color:#c0392b}
.meta{color:var(--muted);font-size:12.5px;margin:0 0 20px}
.grid{display:grid;gap:18px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.card h3{margin:0 0 4px;font-size:14.5px}.card svg{display:block}.card .sub{margin:0 0 12px;font-size:11.5px;color:var(--muted)}
.kpi{font-size:27px;font-weight:900;letter-spacing:-.02em}.kpi small{font-size:12px;font-weight:700;color:var(--muted);margin-left:5px}
.chg{font-size:12px;font-weight:800}.chg.up{color:#0f8a5f}.chg.dn{color:var(--red)}
.na{display:grid;place-items:center;min-height:250px;border:1px dashed #d6dfe3;border-radius:12px;background:#fbfcfd;text-align:center;padding:26px}
.na b{display:block;font-size:15px;color:#8a949a;margin:8px 0 8px}.na span{font-size:12.5px;color:#a3adb3;line-height:1.7;max-width:520px;display:block}
.na-tag{display:inline-block;padding:3px 11px;border-radius:999px;background:#fdecec;color:#c0392b;font-size:11.5px;font-weight:800}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:8px 9px;border-bottom:1px solid #eef2f4;text-align:right}
th:first-child,td:first-child{text-align:left}th{color:var(--muted);font-weight:700;background:#fafcfd}
tbody tr:hover{background:#f7fbfd}
.foot{margin-top:26px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:11.5px;line-height:1.8}
svg text{font-family:inherit}
.legend{display:flex;flex-wrap:wrap;gap:9px;margin-top:10px;font-size:11.5px;color:var(--muted)}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}
</style></head><body>

    s.data.forEach((v,i)=>{if(v===null||v===undefined){if(seg.length>1)paths+=`<polyline points="${seg.join(' ')}" fill="none" stroke="${c}" stroke-width="2.4"/>`;seg=[];return}seg.push(`${x(i)},${y(v)}`)});
    if(seg.length>1)paths+=`<polyline points="${seg.join(' ')}" fill="none" stroke="${c}" stroke-width="2.4"/>`;
    body+=paths;
    s.data.forEach((v,i)=>{if(v===null||v===undefined)return;body+=`<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="${c}" stroke="#fff" stroke-width="1.6"><title>${esc(labels[i])} · ${esc(s.name)}: ${fmt(v,1)}${unit||''}</title></circle>`;
      body+=`<text x="${x(i)}" y="${y(v)-11}" text-anchor="middle" font-size="10.5" font-weight="700" fill="${c}">${fmt(v,Math.abs(v)<100?1:0)}</text>`});
  });
  const xa=labels.map((l,i)=>`<text x="${x(i)}" y="${h-padB+20}" text-anchor="middle" font-size="11" fill="#68777e">${esc(l)}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${h}" width="100%">${g1}<line x1="${padL}" x2="${W-padR}" y1="${h-padB}" y2="${h-padB}" stroke="#aab4ba"/>${body}${xa}</svg>`;
}
function barSVG(labels,vals,colorFn,unit,opt={}){
  const h=opt.h||300,W=Math.max(620,labels.length*52),padL=58,padR=16,padT=26,padB=opt.rotate?86:40;
  const v0=nn(vals);if(!v0.length)return '<div class="na"><b>표시할 값이 없습니다</b></div>';
  let hi=Math.max(...v0,0),lo=Math.min(...v0,0);const g=(hi-lo)*0.16||1;hi+=g;if(lo<0)lo-=g;
  const y=v=>padT+(hi-v)*(h-padT-padB)/(hi-lo);
  const bw=Math.min(40,(W-padL-padR)/labels.length*0.6);
  let grid='';for(let i=0;i<5;i++){const v=lo+(hi-lo)*i/4;grid+=`<line x1="${padL}" x2="${W-padR}" y1="${y(v)}" y2="${y(v)}" stroke="#eef2f4"/><text x="${padL-9}" y="${y(v)+4}" text-anchor="end" font-size="10.5" fill="#8b969c">${fmt(v,opt.decimals||0)}</text>`}
  let body='';
  labels.forEach((l,i)=>{const v=vals[i];const cx=padL+(i+0.5)*(W-padL-padR)/labels.length;
    if(v!==null&&v!==undefined){const c=colorFn(l,i),top=Math.min(y(v),y(0)),hh=Math.abs(y(v)-y(0));
      body+=`<rect x="${cx-bw/2}" y="${top}" width="${bw}" height="${Math.max(1,hh)}" rx="3" fill="${c}"><title>${esc(l)}: ${fmt(v,opt.decimals||0)}${unit||''}</title></rect>`;
      body+=`<text x="${cx}" y="${(v>=0?y(v)-7:y(v)+15)}" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3d4a51">${fmt(v,opt.decimals||0)}</text>`}
    body+=opt.rotate?`<text x="${cx}" y="${h-padB+16}" text-anchor="end" font-size="11" fill="#68777e" transform="rotate(-40 ${cx} ${h-padB+16})">${esc(l)}</text>`
                    :`<text x="${cx}" y="${h-padB+20}" text-anchor="middle" font-size="11" fill="#68777e">${esc(l)}</text>`});
  return `<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${h}" width="${W}" style="max-width:none">${grid}<line x1="${padL}" x2="${W-padR}" y1="${y(0)}" y2="${y(0)}" stroke="#aab4ba"/>${body}</svg></div>`;
}
function treemap(items,el){
  const tot=items.reduce((a,b)=>a+(b.value||0),0);if(!tot)return '<div class="na"><b>표시할 값이 없습니다</b></div>';
  const W=760,H=340;const sorted=[...items].filter(i=>i.value>0).sort((a,b)=>b.value-a.value);
  let x=0,y=0,w=W,h=H,i=0,out='';
  const rest=[...sorted];
  while(rest.length){
    const it=rest.shift();const frac=it.value/rest.concat(it).reduce((a,b)=>a+b.value,0);
    let rx,ry,rw,rh;
    if(w>=h){rw=w*frac;rh=h;rx=x;ry=y;x+=rw;w-=rw}else{rw=w;rh=h*frac;rx=x;ry=y;y+=rh;h-=rh}
    const c=PAL[i%PAL.length];i++;
    const showTxt=rw>62&&rh>34;
    out+=`<g><rect x="${rx}" y="${ry}" width="${Math.max(0,rw-2)}" height="${Math.max(0,rh-2)}" fill="${c}" rx="4"><title>${esc(it.name)}: ${it.display}</title></rect>`;
    if(showTxt)out+=`<text x="${rx+9}" y="${ry+21}" font-size="12" font-weight="800" fill="#fff">${esc(it.name)}</text><text x="${rx+9}" y="${ry+38}" font-size="11" fill="#ffffffcc">${esc(it.display)}</text>`;
    out+='</g>';
  }
  return `<svg viewBox="0 0 ${W} ${H}" width="100%">${out}</svg>`;
}
